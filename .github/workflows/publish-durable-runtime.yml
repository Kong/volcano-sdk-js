name: Publish durable runtime

# @volcano.dev/durable-runtime is a pass-through: its only content is the
# version range of the runtime it depends on. It changes when that range does
# and not with the SDK, so it is released on its own rather than on the SDK's
# train, and by hand rather than by Release Please.
#
# Bump the version in packages/durable-runtime/package.json first, merge that,
# then run this against main with the same version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to publish, without a leading v.
        required: true

permissions:
  contents: read

concurrency:
  group: publish-durable-runtime
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse anything but main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      # The guard that keeps the published range equal to the SDK's own.
      - run: pnpm jest __tests__/durable-runtime-package.test.js __tests__/durable-runtime-preferred.test.js __tests__/durable-runtime-fallback.test.js
      - name: Check the package version against the input
        env:
          VERSION: ${{ inputs.version }}
        run: test "$(node -p "require('./packages/durable-runtime/package.json').version")" = "$VERSION"
      - run: mkdir package && npm pack --ignore-scripts --pack-destination ../../package
        working-directory: packages/durable-runtime
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: durable-runtime-package
          path: package/*.tgz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      # Publishing receives only the checked build artifact, not source or build credentials.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: durable-runtime-package
          path: package
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - name: Publish without downgrading latest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          latest="$(npm view @volcano.dev/durable-runtime dist-tags.latest 2>/dev/null || true)"
          if [ -n "$latest" ]; then
            newest="$(printf '%s\n%s\n' "$VERSION" "$latest" | sort -V | tail -1)"
            if [ "$newest" != "$VERSION" ]; then
              echo "Refusing to replace npm latest $latest with older $VERSION." >&2
              exit 1
            fi
          fi
          npm publish ./package/*.tgz --ignore-scripts --provenance --access public
