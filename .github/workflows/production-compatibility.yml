name: SDK production compatibility

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: sdk-compatibility-${{ github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

jobs:
  select:
    name: Select release PR candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      selected: ${{ steps.select.outputs.selected }}
      source_sha: ${{ steps.select.outputs.source_sha }}
      pull_request: ${{ steps.select.outputs.pull_request }}
      candidate_run_id: ${{ steps.select.outputs.candidate_run_id }}
      candidate_artifact_id: ${{ steps.select.outputs.candidate_artifact_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - run: npm ci --prefix .github/release-tools --omit=dev --ignore-scripts --no-audit --no-fund
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/release-tools/compatibility.mjs select

  check:
    name: Native SDK checks
    needs: select
    if: github.event_name == 'pull_request' && needs.select.outputs.selected == 'true' && needs.select.outputs.candidate_artifact_id == ''
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  build:
    name: Build candidate
    needs: [select, check]
    if: github.event_name == 'pull_request' && needs.select.outputs.selected == 'true' && needs.select.outputs.candidate_artifact_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix .github/release-tools --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Verify selected build source
        env:
          SOURCE_SHA: ${{ needs.select.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - run: pnpm build
      - run: pnpm test:package
      - run: mkdir package && cp reports/volcano-sdk.tgz package/sdk.tgz
      - run: node scripts/test-package-quickstart.mjs package/sdk.tgz
      - name: Record immutable candidate
        env:
          SOURCE_SHA: ${{ needs.select.outputs.source_sha }}
          RELEASE_PR: ${{ needs.select.outputs.pull_request }}
        run: node .github/release-tools/release.mjs manifest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: sdk-candidate
          path: package/
          if-no-files-found: error
          retention-days: 90

  acceptance:
    name: JavaScript SDK installed-package acceptance
    needs: [select, build]
    if: >-
      always() && needs.select.result == 'success' && needs.select.outputs.selected == 'true' &&
      (needs.build.result == 'success' || needs.select.outputs.candidate_artifact_id != '')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: sdk-production-compatibility
    concurrency:
      group: sdk-production-account
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: .github/release-tools
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - run: npm ci --prefix .github/release-tools --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Read Hosting tests using the Kong app
        id: hosting-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.KONG_GH_APP_ID }}
          private-key: ${{ secrets.KONG_GH_APP_PRIVATE_KEY }}
          owner: Kong
          repositories: volcano-hosting
          permission-contents: read
      - name: Checkout pinned Hosting tests
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Kong/volcano-hosting
          ref: 98de403c02ad50e7b939be5a3bd73816002c7372
          token: ${{ steps.hosting-token.outputs.token }}
          sparse-checkout: tests/sdk-contract
          path: hosting
          persist-credentials: false
      - run: npm ci --prefix hosting/tests/sdk-contract --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.select.outputs.candidate_run_id }}
          artifact-ids: ${{ needs.build.outputs.artifact_id || needs.select.outputs.candidate_artifact_id }}
          merge-multiple: true
          path: package
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::476702565877:role/volcano-hosting-sdk-acceptance-production
          aws-region: us-east-2
          role-duration-seconds: 10800
      - name: Run acceptance and cleanup
        run: |
          node hosting/tests/sdk-contract/runner/run.mjs run \
            --sdk "$PWD/package/sdk.tgz" --environment production --report-dir "$PWD/acceptance"
      - name: Bind acceptance to the release PR package
        env:
          SOURCE_SHA: ${{ needs.select.outputs.source_sha }}
          CANDIDATE_RUN_ID: ${{ needs.select.outputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id || needs.select.outputs.candidate_artifact_id }}
        run: node .github/release-tools/release.mjs attest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sdk-compatibility
          path: acceptance/
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  complete:
    name: Production compatibility
    if: always()
    needs: [select, acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          SELECT_RESULT: ${{ needs.select.result }}
          SELECTED: ${{ needs.select.outputs.selected }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          test "$SELECT_RESULT" = success
          if [[ "$SELECTED" == true ]]; then
            test "$ACCEPTANCE_RESULT" = success
          else
            test "$SELECTED" = false
            [[ "$HEAD_BRANCH" != release-please--* ]]
          fi
