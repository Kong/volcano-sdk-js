name: Publish SDK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Merged Release Please PR whose tested package should be published.
        type: string
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: sdk-publication
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

jobs:
  select:
    name: Select manually merged release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      selected: ${{ steps.select.outputs.selected }}
      pull_request: ${{ steps.select.outputs.pull_request }}
      merge_sha: ${{ steps.select.outputs.merge_sha }}
      compatibility_run_id: ${{ steps.select.outputs.compatibility_run_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - run: npm ci --prefix .github/release-tools --omit=dev --ignore-scripts --no-audit --no-fund
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/release-tools/release.mjs select

  publish:
    name: Publish tested SDK files
    needs: select
    if: needs.select.outputs.selected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-production
    permissions:
      contents: write
      actions: write
      pull-requests: read
      issues: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_PR: ${{ needs.select.outputs.pull_request }}
      MERGE_SHA: ${{ needs.select.outputs.merge_sha }}
      COMPATIBILITY_RUN_ID: ${{ needs.select.outputs.compatibility_run_id }}
    outputs:
      candidate_run_id: ${{ steps.candidate.outputs.candidate_run_id }}
      candidate_artifact_id: ${{ steps.candidate.outputs.candidate_artifact_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: .github/release-tools
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm ci --prefix .github/release-tools --omit=dev --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.select.outputs.compatibility_run_id }}
          name: sdk-compatibility
          path: acceptance
      - name: Verify passing PR evidence and identical merged source
        id: candidate
        run: node .github/release-tools/release.mjs candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.candidate.outputs.candidate_run_id }}
          artifact-ids: ${{ steps.candidate.outputs.candidate_artifact_id }}
          merge-multiple: true
          path: package
      - run: npm install -g npm@11
      - name: Recheck evidence, then publish tested bytes
        run: |
          node .github/release-tools/release.mjs evidence
          node .github/release-tools/publish.mjs
      - name: Create stable release for the published files
        run: node .github/release-tools/release.mjs release

  smoke:
    name: Verify published registry installation
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: .github/release-tools
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.publish.outputs.candidate_run_id }}
          artifact-ids: ${{ needs.publish.outputs.candidate_artifact_id }}
          merge-multiple: true
          path: package
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - run: npm ci --prefix .github/release-tools --omit=dev --ignore-scripts --no-audit --no-fund
      - run: node .github/release-tools/publish.mjs smoke
