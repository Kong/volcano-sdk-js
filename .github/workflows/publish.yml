name: Publish SDK

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-sdk
  cancel-in-progress: false
  # Retain pending runs for versions that already have a GitHub release.
  queue: max

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and ancestry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$RELEASE_TAG" = "v$(jq -er '.["."]' .release-please-manifest.json)"

  check:
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    outputs:
      package-artifact-id: ${{ steps.upload-package.outputs.artifact-id }}
      bundle-artifact-id: ${{ steps.upload-acceptance.outputs.artifact-id }}
    needs: [validate, check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:package
      - run: mkdir package && npm pack --ignore-scripts --pack-destination package
      - run: bash scripts/build-acceptance.sh package/*.tgz acceptance-output
      - name: Check package version against the release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload-package
        with:
          name: release-package
          path: package/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload-acceptance
        with:
          name: acceptance-tests
          path: acceptance-output/sdk-acceptance.tar.gz
          if-no-files-found: error

  acceptance-check:
    needs: build
    uses: ./.github/workflows/verify-acceptance.yml
    with:
      package-artifact-id: ${{ needs.build.outputs.package-artifact-id }}
      bundle-artifact-id: ${{ needs.build.outputs.bundle-artifact-id }}

  attest:
    needs: [build, acceptance-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.package-artifact-id }}
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.bundle-artifact-id }}
          merge-multiple: true
          path: release
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/*
      - name: Publish acceptance bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq sdk-acceptance.tar.gz; then
            mkdir previous
            gh release download "$RELEASE_TAG" --pattern sdk-acceptance.tar.gz --dir previous
            gh attestation verify previous/sdk-acceptance.tar.gz --repo "$GH_REPO" --signer-workflow "$GH_REPO/.github/workflows/publish.yml" --source-ref "refs/tags/$RELEASE_TAG" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
            # Keep the authenticated original when a retry rebuilds the same SDK.
            tar -xOf previous/sdk-acceptance.tar.gz ./acceptance.json | jq -S . > previous.json
            tar -xOf release/sdk-acceptance.tar.gz ./acceptance.json | jq -S . > current.json
            cmp previous.json current.json
            exit 0
          fi
          gh release upload "$RELEASE_TAG" release/sdk-acceptance.tar.gz

  publish:
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      # Publishing receives only the checked build artifact, not source or build credentials.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.package-artifact-id }}
          merge-multiple: true
          path: package
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - name: Publish without downgrading latest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          latest="$(npm view @volcano.dev/sdk dist-tags.latest)"
          newest="$(printf '%s\n%s\n' "$version" "$latest" | sort -V | tail -1)"
          if [ "$newest" != "$version" ]; then
            echo "Refusing to replace npm latest $latest with older $version." >&2
            exit 1
          fi
          npm publish ./package/*.tgz --ignore-scripts --provenance --access public

  registry-smoke:
    needs: [publish, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.bundle-artifact-id }}
          merge-multiple: true
          path: acceptance-output
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
      - name: Check the registry download in a fresh consumer
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir consumer
          tar -xzf acceptance-output/sdk-acceptance.tar.gz -C consumer
          cd consumer
          package="$(npm pack "@volcano.dev/sdk@${RELEASE_TAG#v}" --ignore-scripts --silent --registry=https://registry.npmjs.org)"
          node -e 'const fs=require("node:fs"), crypto=require("node:crypto"), a=require("./acceptance.json"); if(crypto.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex")!==a.sha256) throw Error("Registry package differs from build")' "$package"
          node scripts/test-package-quickstart.mjs "$package"

  release-link:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Link the published npm version in the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          notes="$(gh release view "$RELEASE_TAG" --json body --jq '.body')"
          link="[View ${RELEASE_TAG} on npm](https://www.npmjs.com/package/@volcano.dev/sdk/v/${RELEASE_TAG#v})"
          if [[ "$notes" != *"$link"* ]]; then
            printf '%s\n\n%s\n' "$notes" "$link" | gh release edit "$RELEASE_TAG" --notes-file -
          fi
