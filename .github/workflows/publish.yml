name: Publish SDK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Original merged release build run; recovery never rebuilds its package.
        type: string
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: sdk-release-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publication' }}
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

jobs:
  select:
    name: Select reviewed SDK source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      selected: ${{ steps.select.outputs.selected }}
      mode: ${{ steps.select.outputs.mode }}
      source_sha: ${{ steps.select.outputs.source_sha }}
      candidate_run_id: ${{ steps.select.outputs.candidate_run_id }}
      candidate_artifact_id: ${{ steps.select.outputs.candidate_artifact_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - run: npm ci --prefix .github/release-tools --omit=dev --ignore-scripts --no-audit --no-fund
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/release-tools/release.mjs select

  check:
    name: Native SDK checks
    needs: select
    if: github.event_name != 'workflow_dispatch' && needs.select.outputs.selected == 'true' && needs.select.outputs.candidate_artifact_id == ''
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  build:
    name: Build candidate
    needs: [select, check]
    if: github.event_name != 'workflow_dispatch' && needs.select.outputs.selected == 'true' && needs.select.outputs.candidate_artifact_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix .github/release-tools --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Verify selected build source
        env:
          SOURCE_SHA: ${{ needs.select.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - run: pnpm build
      - run: pnpm test:package
      - run: mkdir package && cp reports/volcano-sdk.tgz package/sdk.tgz
      - run: node scripts/test-package-quickstart.mjs package/sdk.tgz
      - name: Record immutable candidate
        env:
          SOURCE_SHA: ${{ needs.select.outputs.source_sha }}
        run: node .github/release-tools/release.mjs manifest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: sdk-candidate
          path: package/
          if-no-files-found: error
          retention-days: 90

  acceptance:
    name: Hosting acceptance and production readiness
    needs: [select, build]
    if: >-
      always() && needs.select.outputs.selected == 'true' &&
      (needs.build.result == 'success' || needs.select.outputs.candidate_artifact_id != '')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: sdk-release-validation
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    outputs:
      hosting_run_id: ${{ steps.hosting.outputs.hosting_run_id }}
      artifact_id: ${{ needs.build.outputs.artifact_id || needs.select.outputs.candidate_artifact_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_MODE: ${{ needs.select.outputs.mode }}
      CANDIDATE_ARTIFACT: ${{ needs.build.outputs.artifact_id || needs.select.outputs.candidate_artifact_id }}
      CANDIDATE_RUN: ${{ needs.select.outputs.candidate_run_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - run: npm ci --prefix .github/release-tools --omit=dev --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.select.outputs.candidate_run_id }}
          artifact-ids: ${{ env.CANDIDATE_ARTIFACT }}
          merge-multiple: true
          path: package
      - name: Dispatch full Hosting Staging Validation and wait
        id: hosting
        env:
          HOSTING_APP_ID: ${{ vars.VOLCANO_APP_ID }}
          HOSTING_APP_PRIVATE_KEY: ${{ secrets.VOLCANO_APP_KEY }}
        run: node .github/release-tools/release.mjs wait
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: hosting-token
        with:
          app-id: ${{ vars.VOLCANO_APP_ID }}
          private-key: ${{ secrets.VOLCANO_APP_KEY }}
          owner: Kong
          repositories: volcano-hosting
          permission-actions: read
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          repository: Kong/volcano-hosting
          github-token: ${{ steps.hosting-token.outputs.token }}
          run-id: ${{ steps.hosting.outputs.hosting_run_id }}
          name: sdk-javascript-acceptance
          path: acceptance
      - name: Verify exact Hosting acceptance evidence
        env:
          HOSTING_RUN_ID: ${{ steps.hosting.outputs.hosting_run_id }}
          HOSTING_APP_ID: ${{ vars.VOLCANO_APP_ID }}
          HOSTING_APP_PRIVATE_KEY: ${{ secrets.VOLCANO_APP_KEY }}
        run: node .github/release-tools/release.mjs evidence
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::476702565877:role/volcano-sdk-production-readiness
          aws-region: us-east-2
      - name: Check declared production readiness
        env:
          HOSTING_APP_ID: ${{ vars.VOLCANO_APP_ID }}
          HOSTING_APP_PRIVATE_KEY: ${{ secrets.VOLCANO_APP_KEY }}
        run: node .github/release-tools/release.mjs readiness
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sdk-release-evidence
          path: |
            hosting-run.json
            acceptance/
            production-readiness.json
          if-no-files-found: error
          retention-days: 90

  release-gate:
    name: SDK Release Gate
    if: always()
    needs: [select, acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject missing or skipped release validation
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          SELECTED: ${{ needs.select.outputs.selected }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          test "$SELECT_RESULT" = success
          if [ "$SELECTED" = true ]; then
            test "$ACCEPTANCE_RESULT" = success
          else
            test "$SELECTED" = false
            [[ "$HEAD_REF" != release-please--* ]]
          fi

  publish:
    name: Publish tested SDK files
    needs: [select, acceptance, release-gate]
    if: needs.select.outputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-production
    permissions:
      contents: write
      actions: write
      pull-requests: read
      issues: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_MODE: release
      CANDIDATE_ARTIFACT: ${{ needs.acceptance.outputs.artifact_id }}
      HOSTING_RUN_ID: ${{ needs.acceptance.outputs.hosting_run_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/release-tools
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.select.outputs.candidate_run_id }}
          artifact-ids: ${{ env.CANDIDATE_ARTIFACT }}
          merge-multiple: true
          path: package
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-release-evidence
          path: validation
      - run: mv validation/acceptance acceptance
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm ci --prefix .github/release-tools --omit=dev --ignore-scripts --no-audit --no-fund
      - run: npm install -g npm@11
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::476702565877:role/volcano-sdk-production-readiness
          aws-region: us-east-2
      - name: Recheck acceptance and production, then publish exact bytes
        env:
          HOSTING_APP_ID: ${{ vars.VOLCANO_APP_ID }}
          HOSTING_APP_PRIVATE_KEY: ${{ secrets.VOLCANO_APP_KEY }}
        run: |
          node .github/release-tools/release.mjs evidence
          node .github/release-tools/publish.mjs
      - name: Create stable release for the published files
        run: node .github/release-tools/release.mjs release

  smoke:
    name: Verify published registry installation
    needs: [select, acceptance, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/release-tools
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.select.outputs.candidate_run_id }}
          artifact-ids: ${{ needs.acceptance.outputs.artifact_id }}
          merge-multiple: true
          path: package
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - run: npm ci --prefix .github/release-tools --omit=dev --ignore-scripts --no-audit --no-fund
      - run: node .github/release-tools/publish.mjs smoke
