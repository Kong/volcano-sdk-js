name: Publish SDK

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-sdk
  cancel-in-progress: false
  # Retain pending runs for versions that already have a GitHub release.
  queue: max

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and ancestry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$RELEASE_TAG" = "v$(jq -er '.["."]' .release-please-manifest.json)"

  check:
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    needs: [validate, check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:package
      - run: mkdir package && npm pack --ignore-scripts --pack-destination package
      - name: Run documented quickstart from the release artifact
        run: node .quality-tools/test-package-quickstart.mjs package/*.tgz
      - name: Check package version against the release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: package/*.tgz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      # Publishing receives only the checked build artifact, not source or build credentials.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: package
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.20.0
      - name: Publish without downgrading latest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          latest="$(npm view @volcano.dev/sdk dist-tags.latest)"
          newest="$(printf '%s\n%s\n' "$version" "$latest" | sort -V | tail -1)"
          if [ "$newest" != "$version" ]; then
            echo "Refusing to replace npm latest $latest with older $version." >&2
            exit 1
          fi
          npm publish ./package/*.tgz --ignore-scripts --provenance --access public

  release-link:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Link the published npm version in the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          notes="$(gh release view "$RELEASE_TAG" --json body --jq '.body')"
          link="[View ${RELEASE_TAG} on npm](https://www.npmjs.com/package/@volcano.dev/sdk/v/${RELEASE_TAG#v})"
          if [[ "$notes" != *"$link"* ]]; then
            printf '%s\n\n%s\n' "$notes" "$link" | gh release edit "$RELEASE_TAG" --notes-file -
          fi
