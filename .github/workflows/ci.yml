name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  actions:
    name: GitHub Actions Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.25.x'
          cache: false

      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  sdk:
    name: SDK Lint, Tests, and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22.18.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm lint

      - name: Verify generated OpenAPI types
        run: pnpm check:openapi

      - name: Check TypeScript declarations
        run: pnpm test:types

      - name: Run tests
        run: pnpm test

      - name: Build SDK
        run: pnpm build

      - name: Check npm package contents
        run: npm pack --dry-run

      - name: Smoke test packed package
        run: pnpm test:package

  package-node-20:
    name: Packed Package Smoke (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.1

      - name: Set up Node.js for build
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22.18.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and pack SDK
        run: |
          pnpm build
          npm pack --ignore-scripts --silent > package-tarball.txt

      - name: Set up Node.js for smoke test
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'

      - name: Smoke test packed ESM and CommonJS entry points
        run: |
          package_tarball="$(cat package-tarball.txt)"
          package_path="$GITHUB_WORKSPACE/$package_tarball"
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          npm init --yes >/dev/null
          npm install "$package_path" >/dev/null
          node --input-type=module -e "import('@volcano.dev/sdk').then((sdk) => { if (!sdk.VolcanoAuth) throw new Error('missing ESM root export') })"
          node -e "if (!require('@volcano.dev/sdk').VolcanoAuth) throw new Error('missing CommonJS root export')"
