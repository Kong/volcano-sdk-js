version: 2
updates:
  # The pnpm workspace root. It also covers examples/nextjs-notes-app, a
  # workspace member that shares pnpm-lock.yaml; a separate entry for that
  # directory would duplicate its updates without refreshing the root lockfile.
  # The durable-order-pipeline functions have no lockfile and are left out.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
      semver-major-days: 14
    labels:
      - 'dependencies'
      - 'javascript'
    # Every npm update is `chore`, which Release Please does not release.
    # Dependabot can split prefixes only by `dependencies` vs `devDependencies`,
    # and here `dependencies` also holds the unpublished example app's Next.js
    # and React, so `fix` would cut an SDK release for each example bump.
    # In-range runtime bumps change only pnpm-lock.yaml, which is not published.
    # If an update changes the published `dependencies` range, edit the squash
    # commit title to `fix(deps): ...` when merging.
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      # All four feed `pnpm generate:openapi`: orval and openapi-typescript write
      # src/generated, prettier formats the generated types, and tsc compiles
      # src/generated-runtime. If a bump changes that output, CI's
      # `check:openapi` fails until `pnpm generate:openapi` is run and committed.
      openapi-codegen:
        patterns:
          - 'orval'
          - 'openapi-typescript'
          - 'prettier'
          - 'typescript'
        update-types:
          - 'minor'
          - 'patch'
      npm-production:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      npm-development:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    # GitHub Actions supports only `default-days`.
    cooldown:
      default-days: 5
    labels:
      - 'dependencies'
      - 'github_actions'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
