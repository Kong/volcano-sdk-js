              description: Counts by normalized log level.
            regions:
              type: object
              additionalProperties:
                type: integer
              description: Counts by event region.
            resource_ids:
              type: object
              additionalProperties:
                type: integer
              description: Counts by resource ID.
          required:
            - levels
            - regions
            - resource_ids
        total:
          type: integer
          description: Total events in this bucket.
      required:
        - start_time
        - end_time
        - counts
        - total
    LogActivityResponse:
      type: object
      description: Bucketed runtime log activity.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LogActivityBucket'
        total:
          type: integer
          description: Total events counted across all buckets.
      required:
        - data
        - total
    LogFunctionRequestResource:
      type: object
