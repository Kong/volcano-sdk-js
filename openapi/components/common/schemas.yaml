openapi: 3.0.3
info:
  title: Volcano Hosting Common Schemas
  version: 3.0.0
paths: {}
components:
  schemas:
    AnonKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        key_value:
          type: string
          description: JWT token - use this in frontend Authorization header
        permissions:
          type: array
          items:
            type: string
          description: |
            Permissions granted to this anon key.
            Auth permissions: auth.signup, auth.signin, auth.refresh, auth.logout, auth.password_reset, auth.confirm_email, auth.resend_confirmation
            Storage permissions: storage.upload, storage.download, storage.list, storage.delete
            Realtime permissions: realtime.connect, realtime.subscribe, realtime.publish
            Functions permissions: functions.invoke
          example: ["auth.signup", "auth.signin", "auth.refresh", "auth.logout"]
        is_default:
          type: boolean
          description: Whether this is the project's configured default anon key. Only one key per project can be default.
        created_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - key_value
    AuthConfig:
      type: object
      properties:
        project_id:
          type: string
          format: uuid
        access_token_lifetime:
          type: integer
          description: Access token lifetime in seconds
          default: 3600
        refresh_token_lifetime:
          type: integer
          description: Refresh token lifetime in seconds
          default: 2592000
        inactivity_timeout:
          type: integer
          description: Force re-login after inactivity (seconds, 0=never)
          default: 0
        max_session_duration:
          type: integer
          description: Force re-login after duration (seconds, 0=never)
          default: 0
        min_password_length:
          type: integer
          minimum: 15
          maximum: 128
          default: 15
          description: Configured minimum password length in Unicode characters.
        # No readOnly here: OpenAPI 3.0 ignores every sibling of $ref, so it never
        # had an effect, and strict loaders reject the pair outright.
        password_policy:
          $ref: '#/components/schemas/AuthPasswordPolicy'
        require_uppercase:
          type: boolean
          default: false
        require_lowercase:
          type: boolean
          default: false
        require_numbers:
          type: boolean
          default: false
        require_special_chars:
          type: boolean
          default: false
        enable_signup:
          type: boolean
          description: Master switch - allow new user signups via ANY provider
          default: true
        enable_email_password:
          type: boolean
          description: Enable email/password authentication as a provider
          default: true
        rate_limit_signup:
          type: integer
          description: Signups per hour per IP
          default: 100
        rate_limit_signin:
          type: integer
          description: Signins per hour per IP
          default: 100
        rate_limit_token_refresh:
          type: integer
          description: Refreshes per hour per IP
          default: 1000
        cors_enabled:
          type: boolean
          default: false
        cors_allowed_origins:
          type: array
          items:
            type: string
          example: ["https://myapp.com", "http://localhost:3000"]
        enable_anonymous_signins:
          type: boolean
          description: Allow creating users without email/password
          default: false
        allowed_email_domains:
          type: array
          description: |
            Email domains allowed to create users in this project. Applies to
            email/password signup, OAuth/SSO signup, anonymous conversion, and
            email changes. Empty (the default) allows every domain.

            Entries are stored normalized (lowercase, no `@` prefix) and match
            the domain part exactly: `domain1.com` does not cover
            `mail.domain1.com`. Signups from other domains are rejected with
            403, and `allowed_email_domains_mode` decides whether sign-in is
            covered as well.

            The allowlist is a PRO feature to configure and to enforce. A
            downgrade parks it: the domains are still returned here and stop
            being applied until the project is back on PRO.
          items:
            type: string
          example: ["domain1.com", "domain2.com"]
        allowed_email_domains_mode:
          type: string
          description: |
            How far `allowed_email_domains` reaches. `signup` only gates account
            creation, so accounts that predate the list keep signing in.
            `signup_and_signin` also refuses to issue a session to an account
            whose domain is not listed. `disabled` keeps the list without
            enforcing it.
          enum: [disabled, signup, signup_and_signin]
          default: signup
        platform_token_ttl:
          type: integer
          description: TTL in seconds for platform tokens minted via `/auth/platform/exchange`
          default: 2592000
        allow_password_reset:
          type: boolean
          description: Enable forgot password flow
          default: true
        password_reset_timeout:
          type: integer
          description: Recovery token expiry in seconds
          default: 3600
        max_password_history:
          type: integer
          description: Number of previous passwords to remember (0=disabled)
          default: 0
        cors_allow_credentials:
          type: boolean
          description: Allow credentials in CORS requests
          default: true
        cors_max_age:
          type: integer
          description: CORS preflight cache duration (seconds)
          default: 86400
        require_email_confirmation:
          type: boolean
          description: Require users to confirm email before sign-in. Can only be true when email_enabled is true.
          default: false
        email_confirmation_timeout:
          type: integer
          description: Email confirmation token expiry in seconds.
          default: 86400
        auto_link_verified_oauth:
          type: boolean
          description: Link a verified OAuth identity to an existing confirmed account with the same email instead of returning a conflict. Requires require_email_confirmation to be true.
          default: false
        email_enabled:
          type: boolean
          description: Enable transactional email sending (confirmation, reset, change notifications). Must be true when require_email_confirmation is true.
          default: false
        email_from_address:
          type: string
        email_from_name:
          type: string
        smtp_host:
          type: string
        smtp_port:
          type: integer
          default: 587
        smtp_username:
          type: string
        smtp_password_configured:
          type: boolean
          description: Whether an SMTP password is configured. The password itself is never returned.
          default: false
        smtp_use_tls:
          type: boolean
          default: true
        email_confirmation_subject:
          type: string
        email_password_reset_subject:
          type: string
        email_password_changed_subject:
          type: string
        managed_auth_enabled:
          type: boolean
          description: Enables project-hosted managed auth pages.
          default: false
        post_auth_redirect_url:
          type: string
          description: Default redirect target after successful hosted auth.
        allowed_redirect_urls:
          type: array
          description: Redirect allowlist used to validate post_auth_redirect_url and post_logout_redirect_url.
          items:
            type: string
        post_logout_redirect_url:
          type: string
          description: Redirect target after logout from hosted pages.
        device_verification_url:
          type: string
          description: |
            Optional override for the device-authorization verification page.
            When set, POST /auth/device/authorize returns this URL (with the
            user_code) as verification_uri/verification_uri_complete instead of
            the built-in managed device page. Lets a CLI surface the project's
            own RFC 8628 approval page. Empty falls back to the managed page.
          example: "https://app.acme.com/device"
      required:
        - password_policy
    AuthPasswordPolicy:
      type: object
      additionalProperties: false
      description: Effective backend-enforced password policy.
      properties:
        effective_min_length:
          type: integer
          minimum: 15
          maximum: 128
          description: Effective minimum password length in Unicode characters.
        min_configurable_length:
          type: integer
          minimum: 15
          maximum: 15
          description: Lowest minimum password length accepted by the auth configuration endpoint.
        max_length:
          type: integer
          minimum: 128
          maximum: 128
          description: Maximum password length in Unicode characters.
        require_uppercase:
          type: boolean
          description: Whether passwords must contain an ASCII uppercase letter (A-Z).
        require_lowercase:
          type: boolean
          description: Whether passwords must contain an ASCII lowercase letter (a-z).
        require_numbers:
          type: boolean
          description: Whether passwords must contain an ASCII digit (0-9).
        require_special_chars:
          type: boolean
          description: Whether passwords must contain one of the backend-supported special characters.
        compromised_passwords_rejected:
          type: boolean
          description: Whether common and known-compromised passwords are rejected by the backend.
      required:
        - effective_min_length
        - min_configurable_length
        - max_length
        - require_uppercase
        - require_lowercase
        - require_numbers
        - require_special_chars
        - compromised_passwords_rejected
    AuthHostedPage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        page_type:
          $ref: '#/components/schemas/HostedAuthPageType'
        html:
          type: string
          description: HTML content for this page type.
        css:
          type: string
          description: CSS content for this page type.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AuthHostedPageResponse:
      type: object
      required: [page, defaults, runtime]
      properties:
        page:
          allOf:
            - $ref: '#/components/schemas/AuthHostedPage'
          nullable: true
          description: The saved page, or null when the project has not customized this page type yet.
        defaults:
          $ref: '#/components/schemas/AuthHostedPageDefaults'
        runtime:
          $ref: '#/components/schemas/AuthHostedPageRuntime'
    AuthHostedPageDefaults:
      type: object
      required: [html, css]
      description: |
        The starting point for an unsaved page: the theme shell we render for the
        built-in page plus its stylesheet. Valid input to the update endpoint —
        it carries no script, meta, or link tags.
      properties:
        html:
          type: string
          description: Body shell markup containing the runtime render root.
        css:
          type: string
          description: The built-in stylesheet, themed by the customer.
    AuthHostedPageRuntime:
      type: object
      required: [root_id, script, mock_prelude]
      description: |
        The server-owned behavior of a hosted page. Clients compose previews from
        this instead of reimplementing the page, so a preview cannot drift from
        what is actually served.
      properties:
        root_id:
          type: string
          description: Element id the runtime script renders into. Markup carrying it opts into the theme-shell contract.
        script:
          type: string
          description: The runtime script injected into the rendered page.
        mock_prelude:
          type: string
          description: Preview harness that supplies request params and stubs the hosted-auth API. Never served on a real page.
    AuthSession:
      type: object
      description: An authentication session for a user
      properties:
        id:
          type: string
          format: uuid
          description: Unique session identifier
        user_id:
          type: string
          format: uuid
          description: The user this session belongs to
        provider:
          type: string
          description: Authentication provider used to create this session
          enum:
            - email
            - google
            - github
            - microsoft
            - apple
            - anonymous
          example: "email"
        user_agent:
          type: string
          description: Browser/device user agent string
          example: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)"
        ip_address:
          type: string
          description: IP address of the client when the session was created
          example: "192.168.1.1"
        last_ip_address:
          type: string
          description: IP address of the most recent activity (token refresh)
          example: "192.168.1.100"
        expires_at:
          type: string
          format: date-time
          description: When this session expires
        last_activity_at:
          type: string
          format: date-time
          description: Last activity timestamp
        session_started_at:
          type: string
          format: date-time
          description: When the session was created
        is_active:
          type: boolean
          description: Whether the session is currently active (not expired)
        is_current:
          type: boolean
          description: Whether this is the session making the current request
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - user_id
        - provider
        - expires_at
        - is_active
        - is_current
    AuthIdentity:
      type: object
      description: |
        A real email identity owned by the account. One account can own multiple
        identities (for example a work email plus a personal email linked via OAuth).
      properties:
        id:
          type: string
          format: uuid
          description: Unique identity identifier
        email:
          type: string
          format: email
          description: The email address this identity represents
        email_verified:
          type: boolean
          description: Whether ownership of this email has been verified
        is_primary:
          type: boolean
          description: Whether the account's primary sign-in method resolves to this identity
        created_at:
          type: string
          format: date-time
      required:
        - id
        - email
        - email_verified
        - is_primary
        - created_at
    AuthMethodSummary:
      type: object
      description: |
        A single sign-in method the account owns (password, an OAuth provider, or an
        active anonymous method). `is_primary` reflects the account's primary_method_id.
      properties:
        id:
          type: string
          format: uuid
          description: Unique method identifier
        type:
          type: string
          # x-go-type keeps the server DTO field a plain string. The enum below still
          # drives request validation and SDK/CLI generation, but no Go enum type is
          # emitted — emitting one perturbs oapi-codegen's package-wide enum-constant
          # dedup and renames unrelated provider enum constants in this shared package.
          x-go-type: string
          description: The kind of sign-in method
          enum:
            - password
            - oauth
            - anonymous
        provider:
          type: string
          description: OAuth provider name; present only when type is oauth
          example: google
        identity_id:
          type: string
          # Kept a plain string (not format: uuid) intentionally: it is the identity UUID
          # for password/oauth methods but empty for anonymous methods, which format: uuid
          # would reject.
          description: |
            The identity this method signs in to — a UUID for password/oauth methods,
            empty for anonymous methods.
        email:
          type: string
          description: The email of the method's identity (empty for anonymous)
        is_primary:
          type: boolean
          description: Whether this is the account's primary sign-in method
        last_used_at:
          type: string
          format: date-time
          description: When this method was last used to sign in, if ever
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - type
        - identity_id
        - email
        - is_primary
        - created_at
        - updated_at
    AuthIdentitiesResponse:
      type: object
      properties:
        identities:
          type: array
          items:
            $ref: '#/components/schemas/AuthIdentity'
      required:
        - identities
    AuthMethodsResponse:
      type: object
      properties:
        methods:
          type: array
          items:
            $ref: '#/components/schemas/AuthMethodSummary'
      required:
        - methods
    AuthSignupResponse:
      type: object
      description: |
        Uniform, session-less response returned by POST /auth/signup. It carries no
        tokens and no user object, and is identical for a new account and for an
        already-registered email (anti-enumeration). Clients obtain a session with a
        subsequent POST /auth/signin.
      properties:
        confirmation_required:
          type: boolean
          description: |
            Whether the project requires email confirmation. Reflects project config
            only (identical for a new and an existing email), so it leaks nothing about
            account existence.
        message:
          type: string
          description: Human-readable acknowledgement.
      required:
        - confirmation_required
        - message
    AuthTokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token (expires after configured lifetime)
        token_type:
          type: string
          example: bearer
        expires_in:
          type: integer
          description: Access token lifetime in seconds
        refresh_token:
          type: string
          x-go-type-skip-optional-pointer: true
          description: |
            Long-lived token for getting new access tokens. Omitted when the
            request uses eligible HttpOnly cookie session storage.
        user:
          $ref: '#/components/schemas/AuthUser'
      required:
        - access_token
        - token_type
        - expires_in
        - user
    AuthUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        email_confirmed:
          type: boolean
        user_metadata:
          type: object
          additionalProperties: true
          description: User-editable metadata
        app_metadata:
          type: object
          additionalProperties: true
          description: Application-controlled metadata (read-only for users)
        avatar_url:
          type: string
          format: uri
          description: User avatar URL (from OAuth provider or manually set)
        status:
          type: string
          enum: [active, banned, deleted]
        banned_until:
          type: string
          format: date-time
          nullable: true
          description: When temporary ban expires (null if not banned or permanent)
        last_sign_in_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - email
        - status
    BanUserResponse:
      type: object
      description: Response when banning a user
      properties:
        message:
          type: string
          example: "User banned until 2026-12-31T23:59:59Z"
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum: [banned]
        banned_until:
          type: string
          format: date-time
          nullable: true
          description: When the ban expires (null for permanent ban)
      required:
        - message
        - user_id
        - email
        - status
    BatchFunctionDeployFailure:
      type: object
      properties:
        name:
          type: string
        function_id:
          type: string
          format: uuid
        operation:
          type: string
          enum: [deploy, update]
        error:
          type: string
      required:
        - name
        - error
    BatchFunctionDeployResponse:
      type: object
      properties:
        batch_id:
          type: string
          format: uuid
        data:
          type: array
          description: Functions whose deployment workflows were started successfully
          items:
            $ref: '#/components/schemas/Function'
        failed:
          type: array
          description: Functions that failed before their workflow started. Successful functions are left running; failed new functions are deleted and failed updates are rolled back where possible.
          items:
            $ref: '#/components/schemas/BatchFunctionDeployFailure'
      required:
        - batch_id
        - data
    CompleteUploadSessionResponse:
      type: object
      description: Response when completing an upload
      properties:
        object:
          $ref: '#/components/schemas/StorageObject'
    CreateDatabaseRequest:
      type: object
      description: |
        Create a new PostgreSQL database. Volcano automatically sets up:
        - Auth helpers (auth.uid(), auth.email(), auth.role())
        - Database roles (anon for unauthenticated, authenticated for signed-in users)
        - Secure multi-tenant isolation
        - Ready for Row-Level Security
      properties:
        name:
          type: string
          description: Database name (must be unique within project)
          pattern: '^[a-z0-9_]+$'
          maxLength: 64
          example: "my_database"
        region:
          type: string
          description: Region for database hosting
          example: "aws-us-east-1"
          enum:
            - aws-us-east-1
            - aws-us-east-2
            - aws-us-west-2
            - aws-eu-central-1
            - aws-eu-west-2
            - aws-ap-southeast-1
            - aws-ap-southeast-2
            - aws-sa-east-1
        pg_version:
          type: string
          description: PostgreSQL major version
          example: "16"
          enum: ["15", "16"]
        database_type:
          type: string
          description: |
            Compute size tier (optional, defaults to volcano-db-xs).
            Determines autoscaling limits for the database.
          enum:
            - volcano-db-xs
            - volcano-db-s
            - volcano-db-m
            - volcano-db-l
            - volcano-db-xl
            - volcano-db-2xl
          default: volcano-db-xs
          example: volcano-db-xs
      required:
        - name
        - region
        - pg_version
    CreateEmailTemplateRequest:
      type: object
      properties:
        template_type:
          type: string
          enum: [welcome, confirmation, password_reset, password_changed]
          description: Type of email template
        subject:
          type: string
          description: Email subject line
          example: "Confirm your email"
        html_body:
          type: string
          description: |
            HTML template body. Available placeholders:
            - {{.Token}} - The confirmation/reset token
            - {{.ProjectName}} - The project name
            - {{.Email}} - User's email address
        text_body:
          type: string
          description: Plain text template body (same placeholders as HTML)
      required:
        - template_type
        - subject
        - html_body
        - text_body
    CreateFrontendCustomDomainRequest:
      type: object
      properties:
        domain:
          type: string
          description: Fully-qualified domain name (hostname only, no scheme/path)
          example: app.example.com
        tls:
          $ref: '#/components/schemas/FrontendCustomDomainTLSConfig'
      required:
        - domain
        - tls
    CreateFunctionSchedulerRequest:
      type: object
      required: [name, schedule]
      properties:
        name:
          type: string
          maxLength: 200
        enabled:
          type: boolean
          default: true
        schedule:
          $ref: '#/components/schemas/ScheduleRequest'
        payload:
          type: object
          additionalProperties: true
        regions:
          type: array
          description: Optional single explicit deployed region. If omitted, the scheduler chooses one deployed region and invokes according to the cron expression.
          maxItems: 1
          items:
            type: string
    CreateOAuthConfigRequest:
      type: object
      required:
        - provider
      properties:
        provider:
          type: string
          enum: [google, github, microsoft, apple, device]
          example: "google"
        client_id:
          type: string
          example: "123456789.apps.googleusercontent.com"
          description: Required for non-device providers. Must not be provided for `provider=device`; server always auto-generates it.
        client_secret:
          type: string
          example: "GOCSPX-abc123def456"
          description: Required for non-device providers. Must not be provided for `provider=device`; server always auto-generates it.
        redirect_url:
          type: string
          description: Required for non-device providers. Not used for `provider=device`.
          format: uri
          example: "https://yourapp.com/auth/callback"
        scopes:
          type: array
          items:
            type: string
          example: ["openid", "email", "profile"]
          description: Optional for non-device providers, uses provider defaults if omitted. Not used for `provider=device`.
    CreateProjectRequest:
      type: object
      description: Request to create a new project
      properties:
        name:
          type: string
          description: |
            Project name (must be unique).
            Can only contain letters, numbers, underscores, and hyphens.
          pattern: "^[A-Za-z0-9_-]+$"
          minLength: 1
          maxLength: 255
          example: "my-awesome-app"
        all_regions:
          type: boolean
          description: |
            Optional region policy.
            - `true` (default): project functions deploy to all configured regions
            - `false`: project deploys only to `selected_regions`
          default: true
        selected_regions:
          type: array
          items:
            type: string
          description: |
            Optional region subset. Requires `all_regions=false`.
            Region names must be a subset of platform `AWS_REGIONS`.
          example: ["us-east-1", "us-west-2"]
      required:
        - name
    CreateStorageBucketRequest:
      type: object
      properties:
        name:
          type: string
          description: Bucket name (alphanumeric, dashes, underscores)
          pattern: '^[a-zA-Z0-9_-]+$'
          minLength: 1
          maxLength: 64
        file_size_limit:
          type: integer
          format: int64
          description: Maximum file size in bytes
        allowed_mime_types:
          type: array
          items:
            type: string
          description: Allowed MIME types (e.g., ["image/png", "image/jpeg"])
      required:
        - name
    CreateStoragePolicyRequest:
      type: object
      properties:
        name:
          type: string
          description: Policy name
        operation:
          type: string
          enum: [SELECT, INSERT, UPDATE, DELETE]
          description: Operation this policy applies to
        definition:
          type: string
          description: Policy expression
      required:
        - name
        - operation
        - definition
    CreateUploadSessionRequest:
      type: object
      description: Request to create a resumable upload session
      properties:
        object_path:
          type: string
          description: Target file path within the bucket
          example: "videos/large-file.mp4"
        content_type:
          type: string
          description: MIME type of the file
          example: "video/mp4"
        total_size:
          type: integer
          format: int64
          description: Total file size in bytes (max 5TB)
          minimum: 1
          maximum: 5497558138880
          example: 5368709120
        part_size:
          type: integer
          format: int64
          description: "Part size in bytes (default: 25MB, min: 5MB, max: 25MB)"
          minimum: 5242880
          maximum: 26214400
          example: 26214400
      required:
        - object_path
        - content_type
        - total_size
    CreateUploadSessionResponse:
      type: object
      description: Response when creating an upload session
      properties:
        session_id:
          type: string
          description: Upload session ID
          example: "session-abc123"
        part_size:
          type: integer
          format: int64
          description: Actual part size to use
          example: 26214400
        total_parts:
          type: integer
          description: Number of parts to upload
          example: 52
        expires_at:
          type: string
          format: date-time
          description: When the session expires (7 days from creation)
          example: "2024-01-22T10:30:00Z"
    CreateVariableRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^[a-zA-Z_][a-zA-Z0-9_]*$'
        value:
          type: string
      required:
        - name
        - value
    Database:
      type: object
      description: |
        PostgreSQL database with automatic scalability and security features.
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
          description: Database name
          pattern: '^[a-z0-9_]+$'
          maxLength: 64
        status:
          type: string
          enum: [provisioning, active, failed, deleting]
          description: Database provisioning status
        provisioning_started_at:
          type: string
          format: date-time
          description: Timestamp when the current provisioning phase started
        connection_string:
          type: string
          description: |
            Secure PostgreSQL connection URI for your database.

            The database is identified by the globally-unique username
            (`volcano_client_{database_id}`) already in this URI; the
            `application_name` parameter only selects the access mode:
            - `volcano_full_access` — Full admin access (DDL, migrations)
            - `volcano_user_access:{user_id}` — User impersonation (RLS enforced)
            - `volcano_user_access` — Anonymous access (anon role, RLS enforced)
        region:
          type: string
          description: Region where the database is hosted
          example: aws-us-east-1
        pg_version:
          type: string
          description: PostgreSQL major version
          example: "16"
        database_type:
          type: string
          description: |
            Database size tier that determines available RAM and scaling limits.
          enum:
            - volcano-db-xs
            - volcano-db-s
            - volcano-db-m
            - volcano-db-l
            - volcano-db-xl
            - volcano-db-2xl
          example: volcano-db-xs
        storage_bytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            Latest observed on-disk size from `pg_database_size`, in bytes. This
            point-in-time gauge may be absent until the database has been sampled.
            Summing the latest samples for every database in a project produces
            the project's "Database Storage (Bytes)" usage gauge. Populated on
            database list responses; single-database responses omit it.
        last_invoked_at:
          type: string
          format: date-time
          description: Most recent request timestamp for this database
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - project_id
        - name
        - status
        - created_at
        - updated_at
    DatabaseQueryFilter:
      type: object
      description: One WHERE condition. Conditions are combined with AND.
      properties:
        column:
          type: string
          example: status
        operator:
          type: string
          enum: [eq, neq, gt, gte, lt, lte, like, ilike, is, in]
          example: eq
          description: |
            Filter operators:
            - eq: equals (=)
            - neq: not equals (<>)
            - gt: greater than (>)
            - gte: greater than or equal (>=)
            - lt: less than (<)
            - lte: less than or equal (<=)
            - like: pattern match (LIKE)
            - ilike: case-insensitive pattern match (ILIKE)
            - is: IS NULL / IS NOT NULL
            - in: IN array
        value:
          oneOf:
            - type: string
              nullable: true
            - type: number
            - type: boolean
            - type: array
              description: Array of values, for the `in` operator
              items:
                oneOf:
                  - type: string
                  - type: number
                  - type: boolean
          example: published
      required:
        - column
        - operator
        - value
    DatabaseQueryOrder:
      type: object
      description: One ORDER BY clause.
      properties:
        column:
          type: string
          example: created_at
        ascending:
          type: boolean
          default: true
          example: false
        nulls_first:
          type: boolean
          default: false
      required:
        - column
    DatabaseQueryResult:
      type: object
      description: |
        Rows returned by a data API request. RLS-filtered unless the request was
        made with a service key.
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Result rows
        count:
          type: integer
          description: Number of rows returned
    DatabaseSelectRequest:
      type: object
      properties:
        table:
          type: string
          description: Table name to query
          example: posts
        select:
          type: array
          items:
            type: string
          description: Columns to select (omit for *)
          example: ["id", "title", "content", "created_at"]
        filters:
          type: array
          items:
            $ref: '#/components/schemas/DatabaseQueryFilter'
          description: WHERE conditions (combined with AND)
          example:
            - column: status
              operator: eq
              value: published
            - column: views
              operator: gt
              value: 100
        order:
          type: array
          items:
            $ref: '#/components/schemas/DatabaseQueryOrder'
          description: ORDER BY clauses
          example:
            - column: created_at
              ascending: false
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          description: Maximum rows to return
          example: 10
        offset:
          type: integer
          minimum: 0
          description: Number of rows to skip (for pagination)
          example: 0
      required:
        - table
    DatabaseInsertRequest:
      type: object
      properties:
        table:
          type: string
          description: Table name
          example: posts
        values:
          type: object
          additionalProperties: true
          description: Column values to insert
          example:
            title: "My New Post"
            content: "This is the content"
            status: "draft"
      required:
        - table
        - values
    DatabaseUpdateRequest:
      type: object
      properties:
        table:
          type: string
          description: Table name
          example: posts
        values:
          type: object
          additionalProperties: true
          description: Column values to update
          example:
            title: "Updated Title"
            status: "published"
        filters:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DatabaseQueryFilter'
          description: |
            WHERE conditions for which rows to update. At least one filter is
            required; a filterless update is rejected to avoid rewriting every
            row.
          example:
            - column: id
              operator: eq
              value: "post-uuid"
      required:
        - table
        - values
        - filters
    DatabaseDeleteRequest:
      type: object
      properties:
        table:
          type: string
          description: Table name
          example: posts
        filters:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DatabaseQueryFilter'
          description: WHERE conditions (required for safety)
          example:
            - column: id
              operator: eq
              value: "post-uuid"
      required:
        - table
        - filters
    DatabaseBranch:
      type: object
      description: |
        A copy-on-write fork of a database, for development and testing.

        A branch starts as an exact copy of its parent's data and diverges from
        there. It has its own connection string and its own credential, so a
        branch password cannot reach the parent.

        Every branch expires. `expires_at` is a hard deadline: once it passes the
        branch stops accepting connections and is deleted. Use `PATCH` to extend
        a branch you are still working on.
      properties:
        id:
          type: string
          format: uuid
        database_id:
          type: string
          format: uuid
          description: The parent database this branch was forked from.
        project_id:
          type: string
          format: uuid
        name:
          type: string
          description: Branch name, unique within the parent database.
          pattern: '^[a-z0-9_]+$'
          maxLength: 64
        status:
          type: string
          enum: [provisioning, active, failed, deleting]
          description: |
            Branch status. A new branch starts `provisioning` and is not
            connectable until it reports `active`; poll this endpoint until it
            does. `connection_string` is only present while `active`.

            `provisioning` also covers a branch being rebuilt after a `reset`,
            and a build that is between retries, so it is the status to keep
            waiting on. `failed` is terminal: it means the platform gave up, and
            the branch will not become `active` on its own.
        connection_string:
          type: string
          description: |
            PostgreSQL connection URI for this branch. Present only while the
            branch is `active`.

            The URI carries the branch's own globally-unique username and
            password; `application_name` selects the access mode exactly as it
            does for the parent database:
            - `volcano_full_access` — Full admin access (DDL, migrations)
            - `volcano_user_access:{user_id}` — User impersonation (RLS enforced)
            - `volcano_user_access` — Anonymous access (anon role, RLS enforced)
        ttl_seconds:
          type: integer
          format: int64
          minimum: 1
          description: |
            The lifetime the branch was created with. Resetting a branch re-arms
            this same duration, so a reset never shortens a branch's remaining
            life.
        expires_at:
          type: string
          format: date-time
          description: |
            When the branch stops serving connections and becomes eligible for
            deletion. Enforced on the connection path, so it holds even if
            reclamation is delayed.
        storage_bytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            Bytes this branch has diverged from its parent, which is what a
            branch actually costs. Shared pages are not counted twice. Counts
            against the parent database's storage allowance. Absent until the
            branch has been sampled.
        last_invoked_at:
          type: string
          format: date-time
          description: Most recent request timestamp for this branch
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - database_id
        - project_id
        - name
        - status
        - ttl_seconds
        - expires_at
        - created_at
        - updated_at
    CreateDatabaseBranchRequest:
      type: object
      properties:
        name:
          type: string
          description: Branch name (must be unique within the parent database)
          pattern: '^[a-z0-9_]+$'
          maxLength: 64
          example: "feature_checkout"
        ttl_seconds:
          type: integer
          format: int64
          minimum: 3600
          maximum: 2592000
          description: |
            How long the branch should live, between one hour and 30 days.
            Defaults to 7 days when omitted.
          example: 86400
      required:
        - name
    UpdateDatabaseBranchRequest:
      type: object
      description: Replace the branch's lifetime and restart its countdown from now.
      properties:
        ttl_seconds:
          type: integer
          format: int64
          minimum: 3600
          maximum: 2592000
          description: The new lifetime, between one hour and 30 days.
          example: 86400
      required:
        - ttl_seconds
    DatabaseBranchList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DatabaseBranch'
      required:
        - data
    DatabaseStats:
      type: object
      properties:
        current_storage_bytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            On-disk size right now, in bytes: the database itself plus every
            branch's divergence from it. This is the figure the storage
            allowance is enforced against. `branches` breaks it down.
        current_storage_mb:
          type: number
          format: double
          minimum: 0
          description: '`current_storage_bytes` expressed in megabytes.'
        branches:
          type: array
          description: |
            Per-branch contribution to `current_storage_bytes`. Empty when the
            database has no branches. A branch that has not diverged from its
            parent contributes nothing.
          items:
            $ref: '#/components/schemas/DatabaseBranchStorage'
        storage_bytes:
          type: integer
          format: int64
          description: Total storage used in bytes (data + WAL)
        data_written_bytes:
          type: integer
          format: int64
          description: Total data written in bytes
        data_transfer_bytes:
          type: integer
          format: int64
          description: Total data transferred in bytes
        compute_time_seconds:
          type: number
          format: double
          description: Total CPU seconds consumed
        active_time_seconds:
          type: number
          format: double
          description: Total active compute time in seconds
        time_range:
          type: string
          description: Time range of the metrics (e.g., "2024-01-01T00:00:00Z to 2024-01-02T00:00:00Z")
        granularity:
          type: string
          enum: [hourly, daily, monthly]
          description: Granularity of the aggregated metrics
      required:
        - current_storage_bytes
        - current_storage_mb
        - storage_bytes
        - data_written_bytes
        - data_transfer_bytes
        - compute_time_seconds
        - active_time_seconds
    DatabaseBranchStorage:
      type: object
      description: One branch's contribution to its parent database's storage.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Branch name
        storage_bytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            Bytes this branch has diverged from its parent. Pages the branch
            still shares with the parent are not counted, so this is what the
            branch actually adds to the total rather than its apparent size.
      required:
        - id
        - name
        - storage_bytes
    DatabaseQueryPerformanceDatabase:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
        - id
