          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - domain
        - tls_mode
        - domain_status
        - verification_status
        - effective_urls
        - created_at
        - updated_at
    FrontendCustomDomainTLSConfig:
      type: object
      properties:
        mode:
          type: string
          enum: [byoc]
          default: byoc
          description: BYOC is mandatory for custom domain creation.
        certificate_pem:
          type: string
          description: Required. PEM-encoded certificate.
        private_key_pem:
          type: string
          description: Required. PEM-encoded private key.
        certificate_chain_pem:
          type: string
          description: Optional PEM-encoded certificate chain.
      required:
        - mode
        - certificate_pem
        - private_key_pem
    DeploymentPhase:
      type: object
      description: Timing and outcome for one normalized deployment pipeline phase.
      properties:
        name:
          type: string
          enum: [queue, checkout, build, image, provisioning, rollout, verification]
        status:
          type: string
          enum: [pending, in_progress, succeeded, failed, skipped]
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        duration_seconds:
          type: integer
          format: int64
          minimum: 0
      required:
        - name
        - status
    DeploymentProgress:
      type: object
      description: Normalized live progress derived from the deployment workflow and build phases.
      properties:
        current_phase:
          type: string
          enum: [queue, checkout, build, image, provisioning, rollout, verification]
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        elapsed_seconds:
          type: integer
          format: int64
          minimum: 0
        phases:
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: '#/components/schemas/DeploymentPhase'
        updated_at:
          type: string
          format: date-time
      required:
        - started_at
        - elapsed_seconds
        - phases
        - updated_at
    FrontendDeployment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        frontend_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        operation:
          type: string
          enum: [deploy, redeploy, delete]
        status:
          type: string
          description: |
            Deployment lifecycle status. A `degraded` redeploy remains available while
            edge-only recovery is retried. A `failed` redeploy is recorded here while the
            frontend keeps serving its previous deployment.
          enum: [queued, provisioning, active, degraded, failed, superseded, deleting, deleted]
        deploy_source:
          type: string
          enum: [git, cli, web, api, system, unknown]
          description: What initiated this deployment.
        initiated_by:
          type: string
          description: Platform user that triggered a request-initiated deployment; absent for git and system deployments.
        artifact_bucket:
          type: string
        artifact_key:
          type: string
        artifact_version:
          type: string
        site_url:
          type: string
        cloudformation_stack_id:
          type: string
        cloudformation_stack_url:
          type: string
        codebuild_duration_seconds:
          type: integer
          format: int64
          description: Total CodeBuild build duration recorded for this deployment, in seconds.
        codebuild_build_count:
          type: integer
          description: Number of completed CodeBuild builds included in codebuild_duration_seconds.
        codebuild_duration_recorded_at:
          type: string
          format: date-time
        progress:
          $ref: '#/components/schemas/DeploymentProgress'
        error_message:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - frontend_id
        - project_id
        - operation
        - status
        - deploy_source
        - created_at
        - updated_at
    FrontendDomainRoutingRecord:
      type: object
      properties:
        record_type:
          type: string
          enum: [CNAME]
        name:
