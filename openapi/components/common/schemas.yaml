    Function:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 63
          pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
        status:
          type: string
          enum: [provisioning, active, failed, deleting]
        provisioning_started_at:
          type: string
          format: date-time
          description: Timestamp when the current provisioning phase started
        is_public:
          type: boolean
          description: |
            Function visibility for anon-key invocation.
            - `false` (default): only auth user tokens and service keys can invoke
            - `true`: anon keys with `functions.invoke` can invoke
        aws_function_arn:
          type: string
        invoke_url:
          type: string
          description: Canonical GeoDNS endpoint URL for invoking this function (always HTTPS)
        deployed_regions:
          type: array
          items:
            type: string
          description: Regions where this function is currently deployed
        runtime:
          type: string
        handler:
          type: string
        current_deployment_id:
          type: string
          format: uuid
          description: Identifier of the latest function deployment operation
        pending_deployment_id:
          type: string
          format: uuid
          description: Newest queued deployment that will run after the current operation
        last_invoked_at:
          type: string
          format: date-time
          description: Most recent successful invocation timestamp
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - project_id
        - name
        - status
        - is_public
        - deployed_regions
        - created_at
        - updated_at
    FunctionDeployment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        function_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        batch_id:
          type: string
          format: uuid
        operation:
          type: string
          enum: [deploy, update, delete]
        status:
          type: string
          enum: [queued, provisioning, active, failed, superseded, deleting, deleted]
        deploy_source:
          type: string
          enum: [git, cli, web, api, system, unknown]
          description: What initiated this deployment.
        initiated_by:
          type: string
          description: Platform user that triggered a request-initiated deployment; absent for git and system deployments.
        artifact_bucket:
          type: string
        artifact_key:
          type: string
        artifact_version:
          type: string
        codebuild_duration_seconds:
          type: integer
          format: int64
          description: Total CodeBuild build duration recorded for this deployment, in seconds.
        codebuild_build_count:
          type: integer
          description: Number of completed CodeBuild builds included in codebuild_duration_seconds.
        codebuild_duration_recorded_at:
          type: string
          format: date-time
        progress:
          $ref: '#/components/schemas/DeploymentProgress'
        error_message:
          type: string
        completed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
