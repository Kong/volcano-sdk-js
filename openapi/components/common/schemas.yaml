          items:
            $ref: '#/components/schemas/FrontendUsageDailyEntry'
        total_requests:
          type: integer
          format: int64
        total_errors:
          type: integer
          format: int64
        total_page_views:
          type: integer
          format: int64
      required:
        - frontend_id
