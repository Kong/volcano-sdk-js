    DeviceAuthorizationResponse:
      type: object
      properties:
        device_code:
          type: string
        user_code:
          type: string
        verification_uri:
          type: string
          description: |
            Browser verification URL. Points at the project's managed device
            approval page served by this API:
            `/projects/{projectId}/auth/hosted?action=device&anon_key=...`.
            Requires the project to have managed auth enabled and a default anon
