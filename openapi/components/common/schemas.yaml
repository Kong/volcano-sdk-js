        - updated_at
    ProjectConfig:
      type: object
      additionalProperties: false
      description: |
        Declarative project configuration manifest (the JSON form of
        volcano-config.yaml). Omitted sections are left untouched. Within
        declared entries, omitted optional fields keep their current server
        values (patch semantics). Declared collection keys are fully synced to
        the manifest: `variables`, `buckets[].policies`, `auth.providers.oauth`,
        `auth.email.templates`, and `functions[].schedulers` are reconciled to
        exactly match, deleting resources absent from the manifest. Functions,
        frontends, databases, and buckets are never created or deleted through
        this manifest; entries referencing resources that do not exist are
        skipped and reported.
      properties:
        version:
          type: integer
          enum: [1]
          description: Manifest schema version. Must be 1.
        project:
          $ref: '#/components/schemas/ProjectConfigProject'
        databases:
          type: array
          items:
            $ref: '#/components/schemas/ProjectConfigDatabase'
        variables:
          type: array
          description: Fully synced when declared - variables absent from this list are deleted.
          items:
            $ref: '#/components/schemas/ProjectConfigVariable'
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/ProjectConfigBucket'
        realtime:
          $ref: '#/components/schemas/ProjectConfigRealtime'
        auth:
          $ref: '#/components/schemas/ProjectConfigAuth'
        functions:
          type: array
          items:
            $ref: '#/components/schemas/ProjectConfigFunction'
        frontends:
          type: array
          items:
            $ref: '#/components/schemas/ProjectConfigFrontend'
      required:
        - version
    ProjectConfigProject:
      type: object
      additionalProperties: false
      description: Project-level settings. `name` renames the project.
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9_-]+$"
          minLength: 1
          maxLength: 255
        all_regions:
          type: boolean
          description: Region policy. `false` requires `selected_regions` (PRO plan).
        selected_regions:
          type: array
          items:
            type: string
          description: Region subset (bare region names). Requires `all_regions=false`.
    ProjectConfigDatabase:
      type: object
      additionalProperties: false
      description: |
        Assertion-only entry for an existing database. No database property is
        mutable through the manifest; declared values are compared against the
        deployed database and any mismatch fails validation. Databases are
        never created or deleted here.
      properties:
        name:
          type: string
          minLength: 1
        region:
          type: string
          description: Deployed region ID (e.g. aws-us-east-1). Asserted, never written.
        pg_version:
          type: string
          enum: ["15", "16"]
          description: PostgreSQL major version. Asserted, never written.
        database_type:
          type: string
          enum:
            - volcano-db-xs
            - volcano-db-s
            - volcano-db-m
            - volcano-db-l
            - volcano-db-xl
            - volcano-db-2xl
          description: |
            Compute tier. Asserted, never written - tier changes are not
            supported via the manifest; use the databases API/CLI/GUI instead.
      required:
        - name
        - region
        - pg_version
    ProjectConfigVariable:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        value:
          type: string
      required:
        - name
        - value
    ProjectConfigBucket:
      type: object
      additionalProperties: false
      description: |
        Settings for an existing storage bucket. Buckets are never created or
        deleted through the manifest. When `policies` is declared it is fully
        synced (policies absent from the list are deleted; an empty list
        deletes all); omitting `policies` leaves the bucket's policies
        untouched.
      properties:
        name:
          type: string
          pattern: '^[a-zA-Z0-9_-]+$'
          minLength: 1
          maxLength: 64
        file_size_limit:
          type: integer
          format: int64
          description: Maximum file size in bytes
        allowed_mime_types:
          type: array
          items:
            type: string
        policies:
          type: array
          items:
            $ref: '#/components/schemas/ProjectConfigBucketPolicy'
      required:
        - name
    ProjectConfigBucketPolicy:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        operation:
          type: string
          enum: [SELECT, INSERT, UPDATE, DELETE]
        definition:
          type: string
          description: Policy expression
      required:
        - name
        - operation
        - definition
    ProjectConfigRealtime:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        broadcast_enabled:
          type: boolean
        presence_enabled:
          type: boolean
        postgres_changes_enabled:
          type: boolean
    ProjectConfigAuth:
      type: object
      additionalProperties: false
      description: Authentication settings, grouped like the dashboard auth-settings tabs.
      properties:
        tokens:
          $ref: '#/components/schemas/ProjectConfigAuthTokens'
        sessions:
          $ref: '#/components/schemas/ProjectConfigAuthSessions'
        signup:
          $ref: '#/components/schemas/ProjectConfigAuthSignup'
        rate_limits:
          $ref: '#/components/schemas/ProjectConfigAuthRateLimits'
        password:
          $ref: '#/components/schemas/ProjectConfigAuthPassword'
        password_reset:
          $ref: '#/components/schemas/ProjectConfigAuthPasswordReset'
        email_verification:
          $ref: '#/components/schemas/ProjectConfigAuthEmailVerification'
        cors:
          $ref: '#/components/schemas/ProjectConfigAuthCORS'
        providers:
          $ref: '#/components/schemas/ProjectConfigAuthProviders'
        email:
          $ref: '#/components/schemas/ProjectConfigAuthEmail'
        managed_pages:
          $ref: '#/components/schemas/ProjectConfigAuthManagedPages'
    ProjectConfigAuthTokens:
      type: object
      additionalProperties: false
      description: Token lifetimes in seconds.
      properties:
        access_token_lifetime:
          type: integer
        refresh_token_lifetime:
          type: integer
        refresh_token_reuse_interval:
          type: integer
        platform_token_ttl:
          type: integer
    ProjectConfigAuthSessions:
      type: object
      additionalProperties: false
      properties:
        inactivity_timeout:
          type: integer
          description: Force re-login after inactivity (seconds, 0=never)
        max_session_duration:
          type: integer
          description: Force re-login after duration (seconds, 0=never)
    ProjectConfigAuthSignup:
      type: object
      additionalProperties: false
      properties:
        enable_signup:
          type: boolean
          description: Master switch for signups across ALL providers
        enable_anonymous_signins:
          type: boolean
        allowed_email_domains:
          type: array
          maxItems: 100
          description: |
            Email domains allowed to create users. Empty allows every domain.
            Replaces the stored list; entries are normalized (lowercase, no `@`
            prefix) and must be bare domains such as `domain1.com`. Matching is
            exact, so subdomains need their own entry. At most 100 entries.

            Restricting signups is a PRO feature to configure and to enforce: a
            FREE project can only declare the list it already has or remove the
            restriction, and the list it keeps is parked until it upgrades.
          items:
            type: string
          example: ["domain1.com", "domain2.com"]
        allowed_email_domains_mode:
          type: string
          description: |
            How far `allowed_email_domains` reaches. `signup` gates account
            creation only. `signup_and_signin` also blocks sign-in for accounts
            outside the list and signs out the ones it locks out. `disabled`
            keeps the list without enforcing it.
          enum: [disabled, signup, signup_and_signin]
    ProjectConfigAuthRateLimits:
      type: object
      additionalProperties: false
      description: Rate limits per hour.
      properties:
        signup:
          type: integer
        signin:
          type: integer
        token_refresh:
          type: integer
        password_reset:
          type: integer
    ProjectConfigAuthPassword:
      type: object
      additionalProperties: false
      properties:
        min_length:
          type: integer
          minimum: 15
          maximum: 128
        require_uppercase:
          type: boolean
        require_lowercase:
          type: boolean
        require_numbers:
          type: boolean
        require_special_chars:
          type: boolean
    ProjectConfigAuthPasswordReset:
      type: object
      additionalProperties: false
      properties:
        allow:
          type: boolean
        timeout:
          type: integer
          description: Password reset token expiry in seconds
        max_history:
          type: integer
          description: Number of previous passwords to disallow (0=disabled)
    ProjectConfigAuthEmailVerification:
      type: object
      additionalProperties: false
      properties:
        require_confirmation:
          type: boolean
          description: Require users to confirm email before sign-in. Requires email sending to be enabled.
        confirmation_timeout:
          type: integer
          description: Email confirmation token expiry in seconds
    ProjectConfigAuthCORS:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        allowed_origins:
          type: array
          items:
            type: string
        allow_credentials:
          type: boolean
        max_age:
          type: integer
    ProjectConfigAuthProviders:
      type: object
      additionalProperties: false
      properties:
        email_password:
          $ref: '#/components/schemas/ProjectConfigAuthEmailPasswordProvider'
        oauth:
          type: array
          description: Fully synced when declared - providers absent from this list are deleted.
          items:
            $ref: '#/components/schemas/ProjectConfigOAuthProvider'
    ProjectConfigAuthEmailPasswordProvider:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
    ProjectConfigOAuthProvider:
      type: object
      additionalProperties: false
      properties:
        provider:
          type: string
          enum: [google, github, microsoft, apple, device]
        enabled:
          type: boolean
        client_id:
          type: string
          description: |
            Required for non-device providers. Server-generated for
            `provider=device` (exported read-only, ignored on apply).
        client_secret:
          type: string
          format: password
          writeOnly: true
          description: Write-only; omitted from config export. Not used for `provider=device`.
        redirect_url:
          type: string
          description: Not used for `provider=device`.
        scopes:
          type: array
          items:
            type: string
      required:
        - provider
    ProjectConfigAuthEmail:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: Enable transactional email sending
        from:
          $ref: '#/components/schemas/ProjectConfigAuthEmailFrom'
        smtp:
          $ref: '#/components/schemas/ProjectConfigAuthEmailSMTP'
        templates:
          $ref: '#/components/schemas/ProjectConfigEmailTemplates'
    ProjectConfigAuthEmailFrom:
      type: object
      additionalProperties: false
      properties:
        address:
          type: string
        name:
          type: string
    ProjectConfigAuthEmailSMTP:
      type: object
      additionalProperties: false
      properties:
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        password:
          type: string
          format: password
          writeOnly: true
          description: Write-only; omitted from config export.
        use_tls:
          type: boolean
    ProjectConfigEmailTemplates:
      type: object
      additionalProperties: false
      description: |
        Email templates keyed by type. Fully synced when declared - template
        types absent from a declared map revert to server defaults (custom
        bodies deleted, subject overrides cleared). Custom template bodies
        require the PRO plan; subject-only changes are available on FREE.
      properties:
        confirmation:
          $ref: '#/components/schemas/ProjectConfigEmailTemplate'
        password_reset:
          $ref: '#/components/schemas/ProjectConfigEmailTemplate'
        password_changed:
          $ref: '#/components/schemas/ProjectConfigEmailTemplate'
        welcome:
          $ref: '#/components/schemas/ProjectConfigEmailTemplate'
    ProjectConfigEmailTemplate:
      type: object
      additionalProperties: false
      properties:
        subject:
          type: string
        html_body:
          type: string
          maxLength: 262144
          description: HTML body. Max 256 KiB. PRO plan required for custom bodies.
        text_body:
          type: string
          maxLength: 262144
          description: Plain-text body. Max 256 KiB. PRO plan required for custom bodies.
    ProjectConfigAuthManagedPages:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: Enable or disable managed auth hosted pages
        redirects:
          $ref: '#/components/schemas/ProjectConfigAuthRedirects'
        pages:
          $ref: '#/components/schemas/ProjectConfigHostedPages'
        appearance:
          $ref: '#/components/schemas/ProjectConfigAuthPageAppearance'
    ProjectConfigAuthRedirects:
      type: object
      additionalProperties: false
      properties:
        allowed:
          type: array
          items:
            type: string
          description: Redirect allowlist. Every entry must be a valid http/https URL.
        post_auth:
          type: string
          description: Must be included in `allowed` when set.
        post_logout:
          type: string
          description: Must be included in `allowed` when set.
        device_verification:
          type: string
          description: Optional custom device-authorization verification page URL.
    ProjectConfigHostedPages:
      type: object
      additionalProperties: false
      description: |
        Hosted auth pages keyed by page type (PRO plan). Upsert-only: omitted
        pages are left untouched (there is no delete for hosted pages).
      properties:
        login:
          $ref: '#/components/schemas/ProjectConfigHostedPage'
        reset_password:
          $ref: '#/components/schemas/ProjectConfigHostedPage'
        signup:
          $ref: '#/components/schemas/ProjectConfigHostedPage'
        forgot_password:
          $ref: '#/components/schemas/ProjectConfigHostedPage'
        device:
          $ref: '#/components/schemas/ProjectConfigHostedPage'
        verify_email:
          $ref: '#/components/schemas/ProjectConfigHostedPage'
    ProjectConfigAuthPageAppearance:
      type: object
      additionalProperties: false
      properties:
        theme:
          $ref: '#/components/schemas/AuthPageTheme'
        layouts:
          $ref: '#/components/schemas/ProjectConfigAuthPageLayouts'
    ProjectConfigAuthPageLayouts:
      type: object
      additionalProperties: false
      properties:
        login:
          $ref: '#/components/schemas/AuthPageLayout'
        signup:
          $ref: '#/components/schemas/AuthPageLayout'
        forgot_password:
          $ref: '#/components/schemas/AuthPageLayout'
        device:
          $ref: '#/components/schemas/AuthPageLayout'
        verify_email:
          $ref: '#/components/schemas/AuthPageLayout'
        reset_password:
          $ref: '#/components/schemas/AuthPageLayout'
    ProjectConfigHostedPage:
      type: object
      additionalProperties: false
      properties:
        html:
          type: string
          maxLength: 262144
          description: Raw HTML markup for the page. Max 256 KiB.
        css:
          type: string
          maxLength: 262144
          description: Optional CSS injected at render time. Max 256 KiB.
      required:
        - html
    ProjectConfigFunction:
      type: object
      additionalProperties: false
      description: |
        Configuration for an existing (deployed) function. Functions are never
        created or deleted through the manifest. When `schedulers` is declared
        it is fully synced (schedulers absent from the list are deleted);
        omitting `schedulers` leaves the function's schedulers untouched.
      properties:
        name:
          type: string
          minLength: 1
        public:
          type: boolean
          description: Function visibility for anon-key invocation
        schedulers:
          type: array
          items:
            $ref: '#/components/schemas/ProjectConfigScheduler'
      required:
        - name
    ProjectConfigScheduler:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        cron:
          type: string
          description: 5-field UTC cron expression
        enabled:
          type: boolean
        payload:
          type: object
          additionalProperties: true
      required:
        - name
        - cron
    ProjectConfigFrontend:
      type: object
      additionalProperties: false
      description: |
        Configuration for an existing (deployed) frontend. Frontends are never
        created or deleted through the manifest. A declared frontend entry
        without `custom_domain` deletes an existing custom domain.
      properties:
        name:
          type: string
          minLength: 1
        custom_domain:
          $ref: '#/components/schemas/ProjectConfigCustomDomain'
      required:
        - name
    ProjectConfigCustomDomain:
      type: object
      additionalProperties: false
      description: |
        Custom domain with BYOC TLS (PRO plan). `tls` is required when the
        domain is first created and optional afterwards: providing new TLS
        material for the same domain rotates the certificate in place (zero
        downtime); omitting `tls` keeps the stored certificate. TLS material is
        write-only and omitted from config export.
      properties:
        domain:
          type: string
          description: Fully-qualified domain name (hostname only, no scheme/path)
        tls:
          $ref: '#/components/schemas/FrontendCustomDomainTLSConfig'
      required:
        - domain
    ProjectConfigApplyResult:
      type: object
      description: Per-resource report for a project config apply (or dry run).
      properties:
        dry_run:
          type: boolean
          description: True when the request was a dry run and no changes were made.
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProjectConfigApplyResultEntry'
        skipped:
          type: array
          description: |
            Manifest entries referencing functions, frontends, databases, or
            buckets that do not exist. Their configuration was not applied;
            deploy/create the resource first, then re-apply.
          items:
            $ref: '#/components/schemas/ProjectConfigSkippedResource'
        missing:
          type: array
          description: |
            Existing functions, frontends, databases, or buckets that have no
            entry in the corresponding declared manifest section.
          items:
            $ref: '#/components/schemas/ProjectConfigMissingResource'
        summary:
          $ref: '#/components/schemas/ProjectConfigApplySummary'
      required:
        - results
        - skipped
        - missing
        - summary
    ProjectConfigApplyResultEntry:
      type: object
      properties:
        section:
          type: string
          description: Manifest section the entry belongs to (e.g. variables, buckets, auth.providers.oauth).
        name:
          type: string
          description: Resource name or key within the section. Empty for singleton sections.
        action:
          type: string
          enum: [created, updated, deleted, unchanged, error]
        error:
          type: string
          description: Error detail when action is `error`.
        notice:
          type: string
          description: Optional operational note (e.g. disabling realtime drops active connections).
      required:
        - section
        - action
    ProjectConfigSkippedResource:
      type: object
      properties:
        type:
          type: string
          enum: [function, frontend, database, bucket]
        name:
          type: string
        reason:
          type: string
      required:
        - type
        - name
        - reason
    ProjectConfigMissingResource:
      type: object
      properties:
        type:
          type: string
          enum: [function, frontend, database, bucket]
        name:
          type: string
      required:
        - type
        - name
    ProjectConfigApplySummary:
      type: object
      properties:
        created:
          type: integer
        updated:
          type: integer
        deleted:
          type: integer
        unchanged:
          type: integer
        errors:
          type: integer
        skipped:
          type: integer
        missing:
          type: integer
      required:
        - created
        - updated
        - deleted
        - unchanged
        - errors
        - skipped
        - missing
    ProjectConfigValidationError:
      type: object
      properties:
        section:
          type: string
          description: Manifest section the error refers to (e.g. databases, functions).
        name:
          type: string
          description: Resource name or key within the section, when applicable.
        message:
          type: string
      required:
        - section
        - message
    ProjectConfigValidationErrorResponse:
      type: object
      description: Returned when manifest validation fails. Nothing was applied.
      properties:
        error:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ProjectConfigValidationError'
      required:
        - error
        - errors
    ProjectUsageResponse:
      type: object
      description: Aggregated usage metrics for a project.
      properties:
        project_id:
          type: string
          format: uuid
          description: Project ID
        month:
          type: string
          description: Usage month in YYYY-MM format
          example: "2026-02"
        metrics:
          type: array
          description: Usage metrics for the project
          items:
            $ref: '#/components/schemas/MetricUsageData'
        frontends:
          type: array
          description: Per-frontend request totals for the current usage month
          items:
            $ref: '#/components/schemas/FrontendUsageData'
      required:
        - project_id
        - month
        - metrics
    RealtimeConfig:
      type: object
      description: |
        Realtime configuration for a project.
        Note: Message size and channels per connection are plan-based (not configurable).
      properties:
        project_id:
          type: string
          format: uuid
          description: Project ID
        enabled:
          type: boolean
          description: Whether realtime is enabled for this project
          default: false
        broadcast_enabled:
          type: boolean
          description: Whether broadcast channels are enabled
          default: true
        presence_enabled:
          type: boolean
          description: Whether presence tracking is enabled
          default: true
        postgres_changes_enabled:
          type: boolean
          description: Whether Postgres change notifications are enabled
          default: true
        created_at:
          type: string
          format: date-time
          description: When the configuration was created
        updated_at:
          type: string
          format: date-time
          description: When the configuration was last updated
    RealtimePlanLimits:
      type: object
      description: Plan-based limits for realtime features
      properties:
        plan:
          type: string
          description: Plan name (FREE or PRO)
          example: "FREE"
        max_connections:
          type: integer
          description: Maximum concurrent connections allowed
          example: 100
        messages_per_month:
          type: integer
          description: Maximum messages per month
          example: 1000000
        message_size_kb:
          type: integer
          description: Maximum message size in KB
          example: 32
        channels_per_conn:
          type: integer
          description: Maximum channels per connection
          example: 100
    RealtimeStats:
      type: object
      description: Realtime usage statistics for a project
      properties:
        num_connections:
          type: integer
          description: Current number of active connections
        peak_connections:
          type: integer
          description: Peak concurrent connections this usage period
        last_invoked_at:
          type: string
          format: date-time
          description: Most recent realtime activity timestamp across channels
        limits:
          $ref: '#/components/schemas/RealtimePlanLimits'
    ResolveFunctionResponse:
      type: object
      properties:
        name:
          type: string
          maxLength: 63
          pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
          description: DNS-safe function name
        function_id:
          type: string
          format: uuid
          description: Canonical function ID used for invocation routing
        cache_ttl_seconds:
          type: integer
          minimum: 1
          description: Suggested SDK cache TTL for this name-to-ID mapping
      required:
        - name
        - function_id
        - cache_ttl_seconds
    ScheduleRequest:
      type: object
      required: [cron_expression]
      properties:
        kind:
          type: string
          enum: [cron]
          default: cron
        cron_expression:
          type: string
          description: Standard 5-field cron expression evaluated in UTC. Seconds fields, descriptors, and Quartz syntax are not supported.
          example: "*/5 * * * *"
    ServiceKey:
      type: object
      description: |
        Service role key for admin operations.
        **WARNING:** Bypasses all RLS - backend use only!
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
          description: Descriptive name for the key
        key_value:
          type: string
          description: |
            Full JWT token for Authorization header.
            Returned on create, get, and list (decrypted from storage).
            **Store securely - NEVER expose in frontend code!**
        key_prefix:
          type: string
          description: First 12 characters of the key for display/identification
          maxLength: 12
        permissions:
          type: array
          items:
            type: string
          description: |
            Operations this key may perform. ["*"] grants full admin access
            (default for keys created without an explicit scope). Scoped keys
            list specific permissions, e.g. ["functions.invoke", "locks.manage"].
          example: ["*"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - key_prefix
        - permissions
    StorageBucket:
      type: object
      description: |
        A named container for files within a project.
        Public access is controlled at the file level via is_public on StorageObject.
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
          description: Bucket name (unique within project)
          pattern: '^[a-zA-Z0-9_-]+$'
          minLength: 1
          maxLength: 64
        file_size_limit:
          type: integer
          format: int64
          nullable: true
          description: Maximum file size in bytes (null for no limit)
        allowed_mime_types:
          type: array
          nullable: true
          items:
            type: string
          description: Allowed MIME types (null for all types)
        last_invoked_at:
          type: string
          format: date-time
          description: Most recent bucket operation timestamp
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
    StorageCopyRequest:
      type: object
      properties:
        from:
          type: string
          description: Source path
        to:
          type: string
          description: Destination path
      required:
        - from
        - to
    StorageListResponse:
      type: object
      properties:
        objects:
          type: array
          items:
            $ref: '#/components/schemas/StorageObject'
        next_cursor:
          type: string
          description: Cursor for next page (empty if no more results)
    StorageMoveRequest:
      type: object
      properties:
        from:
          type: string
          description: Source path
        to:
          type: string
          description: Destination path
      required:
        - from
        - to
    StorageObject:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bucket_id:
          type: string
          format: uuid
        name:
          type: string
          description: Full path within bucket (e.g., "users/abc123/avatar.png")
        owner_id:
          type: string
          format: uuid
          nullable: true
          description: Auth user who uploaded (null for anonymous/service)
        is_public:
          type: boolean
          default: false
          description: |
            If true, the file can be downloaded with just an anon key (no user authentication).
            Files are private by default. Only the owner or a service key can change visibility.
        size:
          type: integer
          format: int64
          description: File size in bytes
        mime_type:
          type: string
          description: MIME type
        etag:
          type: string
          description: Entity tag for cache validation
        metadata:
          type: object
          additionalProperties: true
          description: |
            Custom user metadata (key-value pairs).
            Limits: Maximum 50 keys, maximum 10KB total serialized size.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        public_url:
          type: string
          format: uri
          description: |
            Shareable public URL for this file (only set for public files with is_public=true).
            This URL requires NO authentication and can be embedded in HTML, shared via email, etc.
            The URL is properly URL-encoded by the server - use it as-is without additional encoding.
      required:
        - id
        - bucket_id
        - name
        - is_public
        - size
        - mime_type
    StorageObjectWithBucket:
      type: object
      description: Storage object with bucket name included (for admin listing across buckets)
      properties:
        id:
          type: string
          format: uuid
        bucket_id:
          type: string
          format: uuid
        bucket_name:
          type: string
          description: Name of the bucket containing this object
        name:
          type: string
          description: Full path within bucket
        owner_id:
          type: string
          format: uuid
          nullable: true
          description: Auth user who uploaded (null for anonymous/service)
        is_public:
          type: boolean
          default: false
        size:
          type: integer
          format: int64
          description: File size in bytes
        mime_type:
          type: string
        etag:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        public_url:
          type: string
          format: uri
          description: |
            Shareable public URL for this file (only set for public files with is_public=true).
            This URL requires NO authentication and can be embedded in HTML, shared via email, etc.
      required:
        - id
        - bucket_id
        - bucket_name
        - name
        - is_public
        - size
        - mime_type
    StoragePolicy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bucket_id:
          type: string
          format: uuid
        name:
          type: string
          description: Policy name (unique within bucket)
        operation:
          type: string
          enum: [SELECT, INSERT, UPDATE, DELETE]
          description: Operation this policy applies to
        definition:
          type: string
          description: |
            Policy expression evaluated at request time.
            Examples:
            - "true" - Allow all
            - "auth.uid() = owner_id" - Owner only
            - "auth.role() = 'authenticated'" - Authenticated users
            - "(storage.foldername(name))[1] = auth.uid()::text" - User's folder
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - bucket_id
        - name
        - operation
        - definition
    StorageStats:
      type: object
      description: Aggregate storage statistics for a project
      properties:
        bucket_count:
          type: integer
          description: Number of storage buckets
        object_count:
          type: integer
          description: Total number of stored files
        total_size:
          type: integer
          format: int64
          description: Total storage used in bytes
      required:
        - bucket_count
        - object_count
        - total_size
    StorageVisibilityRequest:
      type: object
      properties:
        is_public:
          type: boolean
          description: Whether the file should be publicly accessible
      required:
        - is_public
    UnbanUserResponse:
      type: object
      description: Response when unbanning a user
      properties:
        message:
          type: string
          example: "User unbanned successfully"
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum: [active]
      required:
        - message
        - user_id
        - email
        - status
    UpdateAuthConfigRequest:
      type: object
      description: "All fields optional - only include fields you want to update. Validation rule: require_email_confirmation=true requires email_enabled=true."
      properties:
        access_token_lifetime:
          type: integer
        refresh_token_lifetime:
          type: integer
        inactivity_timeout:
          type: integer
        max_session_duration:
          type: integer
        min_password_length:
          type: integer
          minimum: 15
          maximum: 128
        require_uppercase:
          type: boolean
        require_lowercase:
          type: boolean
        require_numbers:
          type: boolean
        require_special_chars:
          type: boolean
        enable_signup:
          type: boolean
          description: Master switch for signups across ALL providers
        enable_email_password:
          type: boolean
          description: Enable/disable email/password provider
        rate_limit_signup:
          type: integer
        rate_limit_signin:
          type: integer
        rate_limit_token_refresh:
          type: integer
        cors_allow_credentials:
          type: boolean
        cors_max_age:
          type: integer
        enable_anonymous_signins:
          type: boolean
        allowed_email_domains:
          type: array
          maxItems: 100
          description: |
            Replaces the email domain allowlist. Empty array removes the
            restriction so any domain can sign up. Entries must be bare domains
            such as `domain1.com` and are stored normalized (lowercase, no `@`
            prefix); matching is exact, so subdomains need their own entry. At
            most 100 entries.

            Restricting signups is a PRO feature to configure and to enforce: a
            FREE project can only remove the restriction and gets 403 for any
            other change, and the list it keeps is parked until it upgrades.
          items:
            type: string
          example: ["domain1.com", "domain2.com"]
        allowed_email_domains_mode:
          type: string
          description: |
            How far `allowed_email_domains` reaches. `signup` gates account
            creation only. `signup_and_signin` also blocks sign-in for accounts
            outside the list; switching to it, or narrowing the list while in
            it, deletes the sessions of every account it locks out. `disabled`
            keeps the list without enforcing it.
          enum: [disabled, signup, signup_and_signin]
        allow_password_reset:
          type: boolean
        password_reset_timeout:
          type: integer
        max_password_history:
          type: integer
        require_email_confirmation:
          type: boolean
          description: Require users to confirm email before sign-in. Can only be true when email_enabled is true.
        email_confirmation_timeout:
          type: integer
          description: Email confirmation token expiry in seconds.
        auto_link_verified_oauth:
          type: boolean
          description: Link a verified OAuth identity to an existing confirmed account with the same email instead of returning a conflict. Requires require_email_confirmation to be true.
        email_enabled:
          type: boolean
          description: Enable transactional email sending. Cannot be false while require_email_confirmation is true.
        email_from_address:
          type: string
        email_from_name:
          type: string
        smtp_host:
          type: string
        smtp_port:
          type: integer
        smtp_username:
          type: string
        smtp_password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          description: Replacement SMTP password. Omit this field to preserve the configured password. The value is encrypted at rest and never returned.
        smtp_use_tls:
          type: boolean
        email_confirmation_subject:
          type: string
        email_password_reset_subject:
          type: string
        email_password_changed_subject:
          type: string
        managed_auth_enabled:
          type: boolean
          description: Enable or disable managed auth hosted pages for the project.
        post_auth_redirect_url:
          type: string
          description: Must be included in allowed_redirect_urls when set.
        allowed_redirect_urls:
          type: array
          items:
            type: string
          description: Redirect allowlist. Every entry must be a valid http/https URL.
        post_logout_redirect_url:
          type: string
          description: Must be included in allowed_redirect_urls when set.
        device_verification_url:
          type: string
          description: |
            Optional custom device-authorization verification page. Must be a
            valid http/https URL (not tied to allowed_redirect_urls). When set,
            device-code logins return this URL (with user_code) instead of the
            managed device page. Send an empty string to clear the override.
    TestEmailRequest:
      type: object
      required: [to_email]
      description: |
        When `html_body` or `text_body` is provided the backend renders
        those (plus optional `subject`) through html/text templates
        against the standard `Data` (ProjectName, Name, SiteURL)
        and sends the result — used by the template-editor "Send Test"
        affordance to preview an unsaved template. When both bodies are
        omitted a hardcoded diagnostic message is sent to verify SMTP
        credentials and `subject` is ignored. Sending `subject` alone
        (without a body) is rejected with 400.
      properties:
        to_email:
          type: string
          format: email
          description: Recipient address for the diagnostic email.
        subject:
          type: string
          description: |
            Optional subject override, rendered as a text/template. Only
            applied on the override path — requires `html_body` or
            `text_body` to also be set, otherwise the request is
            rejected with 400.
        html_body:
          type: string
          maxLength: 262144
          description: Optional HTML body override. Rendered as an html/template. Max 256 KiB.
        text_body:
          type: string
          maxLength: 262144
          description: Optional plain-text body override. Rendered as a text/template. Max 256 KiB.
    TestEmailResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
    UpdateAuthHostedPageRequest:
      type: object
      required: [html]
      properties:
        html:
          type: string
          description: Raw HTML markup for the page. Max 256 KiB.
        css:
          type: string
          description: Optional CSS injected at render time. Max 256 KiB.
    UpdateDatabaseTypeRequest:
      type: object
      description: Update database compute size tier
      properties:
        database_type:
          type: string
          description: New compute size tier
          enum:
            - volcano-db-xs
            - volcano-db-s
            - volcano-db-m
            - volcano-db-l
            - volcano-db-xl
            - volcano-db-2xl
          example: volcano-db-m
      required:
        - database_type
    UpdateEmailTemplateRequest:
      type: object
      properties:
        subject:
          type: string
        html_body:
          type: string
        text_body:
          type: string
    UpdateFunctionRequest:
      type: object
      properties:
        is_public:
          type: boolean
          description: |
            Function visibility for anon-key invocation.
            - `false` (default): private function
            - `true`: public function (anon keys with `functions.invoke` can invoke)
      required:
        - is_public
    UpdateFunctionSchedulerRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        enabled:
          type: boolean
        schedule:
          $ref: '#/components/schemas/ScheduleRequest'
        payload:
          type: object
          additionalProperties: true
        regions:
          type: array
          maxItems: 1
          items:
            type: string
    UpdateOAuthConfigRequest:
      type: object
      properties:
        client_id:
          type: string
          description: Supported for non-device providers. Not supported for `provider=device`.
        client_secret:
          type: string
          description: Supported for non-device providers. Not supported for `provider=device`.
        redirect_url:
          type: string
          format: uri
        scopes:
          type: array
          items:
            type: string
        enabled:
          type: boolean
    UpdateProjectRequest:
      type: object
      description: Update mutable project fields (name and/or region policy)
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: "my-awesome-app-renamed"
        all_regions:
          type: boolean
          description: |
            If omitted and `selected_regions` is also omitted, existing region policy is preserved.
            If `selected_regions` is provided without `all_regions`, it is treated as subset mode.
        selected_regions:
          type: array
          items:
            type: string
          description: |
            Region subset for project deployments.
            Provide with `all_regions=false`.
          example: ["us-east-1"]
    UpdateRealtimeConfigRequest:
      type: object
      description: |
        Request to update realtime configuration.
        Limits (message size, channels per connection) are plan-based and cannot be configured.
      properties:
        enabled:
          type: boolean
          description: Whether realtime is enabled for this project
        broadcast_enabled:
          type: boolean
          description: Whether broadcast channels are enabled
        presence_enabled:
          type: boolean
          description: Whether presence tracking is enabled
        postgres_changes_enabled:
          type: boolean
          description: Whether Postgres change notifications are enabled
    UpdateStorageBucketRequest:
      type: object
      properties:
        file_size_limit:
          type: integer
          format: int64
        allowed_mime_types:
          type: array
          items:
            type: string
    UpdateVariableRequest:
      type: object
      properties:
        value:
          type: string
      required:
        - value
    UploadSessionPart:
      type: object
      description: Information about an uploaded part
      properties:
        part_number:
          type: integer
          description: Part number (1-10000)
        etag:
          type: string
          description: ETag of the uploaded part
        size:
          type: integer
          format: int64
          description: Size of the part in bytes
    UploadSessionStatusResponse:
      type: object
      description: Status of an upload session
      properties:
        session_id:
          type: string
          description: Upload session ID
        status:
          type: string
          enum: [pending, uploading, completing, completed, aborted]
          description: Current status of the upload
        path:
          type: string
          description: Target file path
        content_type:
          type: string
          description: MIME type
        total_size:
          type: integer
          format: int64
          description: Total file size in bytes
        part_size:
          type: integer
          format: int64
          description: Size of each part (except last)
        total_parts:
          type: integer
          description: Total number of parts
        parts_uploaded:
          type: integer
          description: Number of parts uploaded
        bytes_uploaded:
          type: integer
          format: int64
          description: Total bytes uploaded so far
        parts:
          type: array
          description: List of uploaded parts (for resume)
          items:
            $ref: '#/components/schemas/UploadSessionPart'
        expires_at:
          type: string
          format: date-time
          description: Session expiry time
        created_at:
          type: string
          format: date-time
          description: Session creation time
    UsageDataPoint:
      type: object
      description: A single timestamped usage value.
      properties:
        timestamp:
          type: string
          format: date-time
          description: UTC timestamp for the data point
        value:
          type: integer
          format: int64
          description: Usage value at the timestamp
      required:
        - timestamp
        - value
    Variable:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 256
        value:
          type: string
        status:
          type: string
          enum: [provisioning, active, failed]
          description: Latest project variable propagation status, when a sync has run.
        current_sync_id:
          type: string
          format: uuid
          description: Identifier of the latest variable propagation sync.
        provisioning_started_at:
          type: string
          format: date-time
          description: Timestamp when the current variable propagation phase started.
        deploy_source:
          type: string
          enum: [git, cli, web, api, system, unknown]
          description: What initiated the latest variable propagation sync, when one has run.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - project_id
        - name
        - value
        - created_at
        - updated_at
