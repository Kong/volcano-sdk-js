        label:
          type: string
          example: NA-East
          description: Human-readable region label suitable for display in pickers.
        flag:
          type: string
          example: "\U0001F1FA\U0001F1F8"
          description: Country flag emoji associated with the region's geography.
    FunctionScheduler:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        function_id:
          type: string
          format: uuid
        name:
          type: string
        enabled:
          type: boolean
        schedule_kind:
          type: string
          enum: [cron]
        cron_expression:
          type: string
        payload:
          type: object
          additionalProperties: true
        regions:
          type: array
          items:
            type: string
        regions_explicit:
          type: boolean
        next_run_at:
          type: string
          format: date-time
        last_started_at:
          type: string
          format: date-time
        last_completed_at:
          type: string
          format: date-time
        last_error:
          type: string
        run_count:
          type: integer
          format: int64
          description: >-
            Total number of times this scheduler has executed. 0 for a
