        - limit
        - total
        - has_more
    LogActivityBucket:
      type: object
      description: Log-event counts for one activity time bucket.
      properties:
        start_time:
          type: string
          format: date-time
          description: Bucket start time.
        end_time:
          type: string
          format: date-time
          description: Bucket end time.
        counts:
          type: object
          description: Counts grouped by activity dimension.
          properties:
            levels:
