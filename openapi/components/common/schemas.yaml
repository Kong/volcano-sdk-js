        ids:
          type: array
          maxItems: 25
          description: Optional function identifiers. Omit or send an empty array to include every function in the project.
          items:
            type: string
            format: uuid
        deployments:
          $ref: '#/components/schemas/LogDeploymentRequestSelector'
      required:
        - type
    LogFrontendRequestResource:
      type: object
      description: Frontend log resource selector.
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - frontend
          description: Resource type to read logs for.
        ids:
          type: array
          maxItems: 25
          description: Optional frontend identifiers. Omit or send an empty array to include every frontend in the project.
          items:
            type: string
            format: uuid
        deployments:
          $ref: '#/components/schemas/LogDeploymentRequestSelector'
      required:
        - type
    LogDatabaseRequestResource:
      type: object
      description: Database runtime log resource selector. Deployment logs are not supported for databases.
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - database
          description: Resource type to read logs for.
        ids:
          type: array
          maxItems: 25
          description: Optional database identifiers. Omit or send an empty array to include every database in the project.
          items:
            type: string
            format: uuid
      required:
        - type
    LogDeploymentRequestSelector:
      type: object
      description: Deployment log selector for deployable resources.
      additionalProperties: false
      properties:
        ids:
          type: array
          maxItems: 25
          description: Optional deployment identifiers. Omit or send an empty array to include every deployment for the selected resources.
          items:
            type: string
            format: uuid
    LogRequestResource:
      description: Resource selectors for project log reads.
      oneOf:
        - $ref: '#/components/schemas/LogFunctionRequestResource'
        - $ref: '#/components/schemas/LogFrontendRequestResource'
        - $ref: '#/components/schemas/LogDatabaseRequestResource'
      discriminator:
        propertyName: type
        mapping:
          function: '#/components/schemas/LogFunctionRequestResource'
          frontend: '#/components/schemas/LogFrontendRequestResource'
          database: '#/components/schemas/LogDatabaseRequestResource'
    LogActivityRequest:
      type: object
      description: Activity request for bucketed log counts.
      additionalProperties: false
      properties:
        resource:
          $ref: '#/components/schemas/LogRequestResource'
        q:
          type: string
          maxLength: 512
          description: Optional activity query. Supports quoted text, implicit AND, AND/OR/NOT, parentheses, and fields such as `level`, `region`, `invocation.id`, `resource.id`, `resource.name`, `function`, `frontend`, `database`, and `body`.
        start_time:
          type: string
          format: date-time
          description: Start time.
        end_time:
          type: string
          format: date-time
          description: End time.
        bucket_count:
          type: integer
          minimum: 1
          maximum: 96
          description: Number of activity buckets to return.
      required:
        - resource
    LogSearchRequest:
      type: object
      description: Search request for project logs.
      additionalProperties: false
      properties:
        resource:
          $ref: '#/components/schemas/LogRequestResource'
        q:
          type: string
          maxLength: 512
          description: Optional log query. Supports quoted text, implicit AND, AND/OR/NOT, parentheses, and fields such as `level`, `region`, `invocation.id`, `resource.id`, `resource.name`, `function`, `frontend`, `database`, and `body`.
        start_time:
          type: string
          format: date-time
          description: Start time.
        end_time:
          type: string
          format: date-time
          description: End time.
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
          description: Maximum number of records to return.
        cursor:
          type: string
          description: Opaque pagination cursor from the previous response's `next_cursor`.
      required:
        - resource
    LogStreamRequest:
      type: object
      description: Stream request for live project logs. Pagination cursors and fixed end times are not supported.
      additionalProperties: false
      properties:
        resource:
          $ref: '#/components/schemas/LogRequestResource'
        q:
          type: string
          maxLength: 512
          description: Optional log query using the same syntax as search and activity requests.
        start_time:
          type: string
          format: date-time
          description: Start time.
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
          description: Maximum number of records to deliver on connect or reconnect before following new events.
      required:
        - resource
    LogSearchEvent:
      allOf:
        - $ref: '#/components/schemas/LogEvent'
        - type: object
          description: Runtime log event returned by project log search. Search results always include a stable event ID and owning resource.
          properties:
            id:
              type: string
              description: Opaque stable log event ID for pagination, deduplication, and display.
            resource:
              $ref: '#/components/schemas/LogResource'
          required:
            - id
            - resource
    LogSearchResponse:
      type: object
      description: Paginated project runtime log search response.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LogSearchEvent'
          description: Array of log events sorted by timestamp, newest first.
        limit:
          type: integer
          description: Number of items requested per page.
        has_more:
          type: boolean
          description: Whether there are more log events available.
        next_cursor:
          type: string
          description: Opaque cursor for the next page. Send this value as `cursor` on the next request.
      required:
        - data
        - limit
        - has_more
