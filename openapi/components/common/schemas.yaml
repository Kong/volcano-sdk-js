        - status
        - deploy_source
        - created_at
        - updated_at
    FunctionInvocationRequest:
      type: object
      properties:
        payload:
          type: object
          additionalProperties: true
          description: |
            Payload to send to the function.

            If invoked with auth user token, Volcano automatically injects `__volcano_auth` context:
            ```javascript
            {
              ...yourPayload,
              __volcano_auth: {
                user_id: "uuid",
                email: "user@example.com",
                project_id: "uuid",
                role: "authenticated" | "anonymous"
              }
            }
            ```
    FunctionInvocationResponse:
      type: object
      description: Raw function response body returned by the invoked function.
      additionalProperties: true
    FunctionRuntimeOption:
      type: object
      required:
        - name
        - language
        - default
        - deployment
      properties:
        name:
          type: string
          example: nodejs24.x
          description: Runtime identifier accepted by function APIs.
        language:
          type: string
          example: nodejs
          description: Runtime language family used by the CLI to choose defaults from source files.
        default:
          type: boolean
          description: Whether this runtime is the CLI default for its language.
        deployment:
          $ref: '#/components/schemas/FunctionRuntimeDeployment'
    FunctionRuntimeDeployment:
      type: object
      required:
        - file_extensions
        - entrypoint
        - handler
        - dependency_manifests
      properties:
        file_extensions:
          type: array
          description: Source file extensions the CLI can use to detect this runtime.
          items:
            type: string
          example:
            - .js
            - .mjs
        entrypoint:
          type: string
          description: Archive path the CLI should use for a single-file function source.
          example: index.js
        handler:
          type: string
          description: Handler symbol the CLI should submit when deploying this runtime.
          example: handler
        dependency_manifests:
          type: array
          description: Dependency manifest files the CLI should include for hosted builds.
          items:
            type: string
          example:
            - package.json
            - package-lock.json
    FunctionRuntimesResponse:
      type: object
