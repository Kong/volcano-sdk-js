  /projects/{id}/auth/hosted:
    get:
      tags:
        - Auth Configuration
      summary: Render default managed auth page
      description: |
        Public HTML endpoint for the managed login page.
        Requires `Accept: text/html`.
      security: []
      operationId: renderDefaultManagedAuthPage
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: action
          in: query
          required: false
          schema:
            type: string
            enum: [login, signup, forgot-password, device]
          description: |
            Optional deep-link action for the unified hosted page. Ignored when a
            custom login page is configured. `action=device` renders the device
            authorization approval UI inline (no redirect to any external app);
            it signs the user in and calls `POST /auth/device/verify`.
        - name: user_code
          in: query
          required: false
          schema:
            type: string
          description: Device user code (from `POST /auth/device/authorize`) used with `action=device`.
        - name: anon_key
          in: query
          required: false
          schema:
            type: string
          description: Project anon key used by built-in managed auth flows (required for login/signup/device actions).
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: |
            Opaque one-time nonce generated by the client SDK before redirecting
            here. On successful login/signup it is echoed back in the post-auth
            redirect fragment as `state`, so the SDK can bind the returned session
            to the flow it initiated (login-CSRF / session-fixation defense). The
            SDK rejects a returned session whose `state` does not match.
      responses:
        '200':
          description: Hosted auth page HTML
          content:
            text/html:
              schema:
                type: string
        '400':
          description: Invalid project id or unsupported Accept header
        '404':
          description: Managed pages disabled
  /projects/{id}/auth/hosted/login/options:
    get:
      tags:
        - Auth Configuration
      summary: Get hosted login runtime options
      description: |
        Returns runtime options for the built-in managed login flow.
        Requires `anon_key` query parameter.
        Rate limited per project and client IP. Excess requests return `429` and `Retry-After`.
      security: []
      operationId: getHostedLoginOptions
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: anon_key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Hosted login options returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostedLoginOptionsResponse'
        '401':
          description: Invalid or missing anon key
        '429':
          description: Rate limit exceeded
        '404':
          description: Managed pages disabled
  /projects/{id}/auth/hosted/login/check-email:
    post:
      tags:
        - Auth Configuration
      summary: Check whether email exists for hosted login flow
      description: |
