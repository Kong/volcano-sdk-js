  /locks/{key}/lease:
    post:
      tags:
        - Locks
      summary: Acquire a project lock
      description: |
        Acquires a project-scoped lease using the project embedded in the service-role key.
        The caller must hold the `locks.manage` permission. Repeating the request with the
        same lock token is idempotent and resets that lease to the requested TTL. A different
        live owner receives `409 lock_held`; a caller whose own lease already lapsed receives
        `409 lock_ownership_lost`.
      operationId: acquireProjectLock
      security:
        - ServiceRoleKey: []
      parameters:
        - $ref: '#/components/parameters/LockKey'
        - $ref: '#/components/parameters/LockToken'
        - $ref: '#/components/parameters/LockRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectLockLeaseRequest'
      responses:
        '201':
          description: Lease acquired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectLockLease'
        '400':
          description: Invalid lock key, token, or TTL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: A non-service credential was supplied or the service key lacks `locks.manage`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            The lock is held by another live lease (`lock_held`), or the caller's own lease
            lapsed and is not yet reclaimable (`lock_ownership_lost`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Project lock request limit exceeded
          headers:
            Retry-After:
              description: Seconds until the current fixed-minute window ends.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Lock service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
        - Locks
      summary: Renew a project lock
      description: |
        Renews a lease owned by the supplied lock token. The request must arrive
        more than one second before `expires_at`; this safety margin prevents
        clock skew between regional API instances from resurrecting an expired
        lease.
      operationId: renewProjectLock
      security:
        - ServiceRoleKey: []
      parameters:
        - $ref: '#/components/parameters/LockKey'
        - $ref: '#/components/parameters/LockToken'
        - $ref: '#/components/parameters/LockRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectLockLeaseRequest'
      responses:
        '200':
          description: Lease renewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectLockLease'
        '400':
          description: Invalid lock key, token, or TTL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: A non-service credential was supplied or the service key lacks `locks.manage`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The lease expired or is owned by another token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Project lock request limit exceeded
          headers:
            Retry-After:
              description: Seconds until the current fixed-minute window ends.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Lock service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Locks
      summary: Release a project lock
      description: Releases a lease only when the supplied lock token still owns it.
      operationId: releaseProjectLock
      security:
        - ServiceRoleKey: []
      parameters:
        - $ref: '#/components/parameters/LockKey'
        - $ref: '#/components/parameters/LockToken'
        - $ref: '#/components/parameters/LockRequestId'
      responses:
        '204':
          description: Lease released
        '400':
          description: Invalid lock key or token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: A non-service credential was supplied or the service key lacks `locks.manage`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The lease is owned by another token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Project lock request limit exceeded
          headers:
            Retry-After:
              description: Seconds until the current fixed-minute window ends.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Lock service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /locks/{key}:
    get:
      tags:
        - Locks
      summary: Read a project lock
      description: |
        Reports whether the lock is currently held, when its lease expires, and the
        holder's fencing token. `held` follows takeover eligibility rather than raw
        expiry, so `held: false` means an acquire would succeed now. No lock token is
        required, making this usable for monitoring and recovery.
      operationId: getProjectLock
      security:
        - ServiceRoleKey: []
      parameters:
        - $ref: '#/components/parameters/LockKey'
        - $ref: '#/components/parameters/LockRequestId'
      responses:
        '200':
          description: Current lock state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectLockState'
        '400':
          description: Invalid lock key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: A non-service credential was supplied or the service key lacks `locks.manage`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Project lock request limit exceeded
          headers:
            Retry-After:
              description: Seconds until the current fixed-minute window ends.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Lock service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Locks
      summary: Force release a project lock
      description: |
        Drops the lease whatever token holds it, for recovering a lock whose holder
        died without releasing. Use `DELETE /locks/{key}/lease` for normal release.

        This breaks mutual exclusion by itself: the previous holder keeps working
        until its own renewal fails. Guard the protected resource with the lease's
        `fencing_token`, which the next acquisition raises, so a write from the
        displaced holder can be rejected. Succeeds when the lock is already absent.
      operationId: forceReleaseProjectLock
      security:
        - ServiceRoleKey: []
      parameters:
        - $ref: '#/components/parameters/LockKey'
        - $ref: '#/components/parameters/LockRequestId'
      responses:
        '204':
          description: Lock released
        '400':
          description: Invalid lock key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: A non-service credential was supplied or the service key lacks `locks.manage`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Project lock request limit exceeded
          headers:
            Retry-After:
              description: Seconds until the current fixed-minute window ends.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Lock service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /storage/{bucketName}/move:
    post:
      tags:
        - Storage Objects
      summary: Move/rename an object
      operationId: moveStorageObject
      security:
        - ServiceRoleKey: []
        - AuthUserAccessToken: []
      parameters:
        - $ref: '#/components/parameters/BucketName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageMoveRequest'
      responses:
        '200':
          description: Object moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageObject'
        '403':
          description: Access denied by storage policy
        '429':
          $ref: '#/components/responses/BandwidthCapExceeded'
  /storage/{bucketName}/copy:
    post:
      tags:
        - Storage Objects
      summary: Copy an object
      operationId: copyStorageObject
      security:
        - ServiceRoleKey: []
        - AuthUserAccessToken: []
      parameters:
        - $ref: '#/components/parameters/BucketName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageCopyRequest'
      responses:
        '201':
          description: Object copied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageObject'
        '403':
          description: Access denied by storage policy
        '429':
          $ref: '#/components/responses/BandwidthCapExceeded'
  /storage/{bucketName}/{path}:
    post:
      tags:
        - Storage Objects
      summary: Upload a file or create resumable session
      description: |
        Unified endpoint for file uploads. Behavior depends on Content-Type and headers:

        **Simple Upload (multipart/form-data):**
        Upload a complete file in a single request. Best for files under 100MB.

        **Create Resumable Session (application/json):**
        Create a session for chunked uploads. Best for large files or unreliable networks.
        Requires: `Content-Type: application/json` with body `{"filename": "...", "content_type": "...", "total_size": ...}`

        **Complete Resumable Session:**
        Complete a session after all parts are uploaded.
        Requires: `X-Upload-Session` header with session ID and `X-Upload-Complete: true` header.
      operationId: uploadStorageObject
      security:
        - AnonKey: []
        - ServiceRoleKey: []
        - AuthUserAccessToken: []
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - name: path
          in: path
          required: true
          description: Object path within bucket
          schema:
            type: string
        - name: X-Upload-Session
          in: header
          required: false
          description: Upload session ID (for completing resumable uploads)
          schema:
            type: string
        - name: X-Upload-Complete
          in: header
          required: false
          description: Set to "true" to complete a resumable upload session
          schema:
            type: string
            enum: ["true"]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File to upload (simple upload)
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadSessionRequest'
      responses:
        '201':
          description: File uploaded or session created
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/StorageObject'
                  - $ref: '#/components/schemas/CreateUploadSessionResponse'
        '200':
          description: Resumable upload completed (when X-Upload-Complete=true)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteUploadSessionResponse'
        '400':
          description: |
            Bad request. This can occur when:
            - MIME type is not in the bucket's allowed_mime_types list
            - File exceeds the bucket's configured file_size_limit
            - File exceeds the global maximum upload size (5GB)
            - Invalid request body or missing required fields
        '403':
          description: Access denied by storage policy
        '413':
          description: |
            File size exceeds plan-based limits. This occurs when:
            - File exceeds the plan-based maximum file size (FREE or PRO tier)
            - Upload would exceed the project's total storage quota
        '429':
          $ref: '#/components/responses/BandwidthCapExceeded'
    put:
      tags:
        - Storage Objects
      summary: Upload a part of a resumable upload
      description: |
        Upload a single part of a resumable upload session.

        **Requirements:**
        - Part numbers start at 1
        - All parts except the last must be at least 5MB
        - Maximum part size is 25MB
        - Parts can be uploaded in any order
        - Re-uploading a part overwrites the previous upload
      operationId: uploadPart
      security:
        - AnonKey: []
        - ServiceRoleKey: []
        - AuthUserAccessToken: []
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - name: path
          in: path
          required: true
          description: Object path within bucket
          schema:
            type: string
        - name: X-Upload-Session
          in: header
          required: true
          description: Upload session ID
          schema:
            type: string
        - name: X-Part-Number
          in: header
          required: true
          description: Part number (1 to 10000)
          schema:
            type: integer
            minimum: 1
            maximum: 10000
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Part uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSessionPart'
        '400':
          description: Invalid part number or part data
        '403':
          description: Access denied
        '404':
          description: Session not found
    get:
      tags:
        - Storage Objects
      summary: Download a file or get upload session status
      description: |
        Download a file, or get the status of a resumable upload session.

        **File Download (default):**
        Downloads the file at the specified path.

        **Session Status (with X-Upload-Session header):**
        Returns the status of a resumable upload session, including which parts have been uploaded.
      operationId: downloadStorageObject
      security:
        - AnonKey: []
        - ServiceRoleKey: []
        - AuthUserAccessToken: []
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - name: path
          in: path
          required: true
          description: Object path within bucket
          schema:
            type: string
        - name: Range
          in: header
          required: false
          description: |
            HTTP Range header for partial downloads.
            Format: bytes=start-end or bytes=start-
            Examples: bytes=0-1023, bytes=1000-
          schema:
            type: string
            pattern: '^bytes=\d+-\d*$'
        - name: X-Upload-Session
          in: header
          required: false
          description: Upload session ID (to get session status instead of downloading)
          schema:
            type: string
      responses:
        '200':
          description: File content or session status
          headers:
            Content-Type:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
            ETag:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSessionStatusResponse'
        '206':
          description: Partial content (range request)
        '400':
          description: Invalid Range header format
        '403':
          description: Access denied by storage policy
        '404':
          description: Object or session not found
        '429':
          $ref: '#/components/responses/BandwidthCapExceeded'
    delete:
      tags:
        - Storage Objects
      summary: Delete a file or abort upload session
      description: |
        Delete a file, or abort a resumable upload session.

        **File Delete (default):**
        Deletes the file at the specified path.

        **Abort Session (with X-Upload-Session header):**
        Aborts a resumable upload session and cleans up any uploaded parts.
      operationId: deleteStorageObject
      security:
        - ServiceRoleKey: []
        - AuthUserAccessToken: []
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - name: path
          in: path
          required: true
          description: Object path within bucket
          schema:
            type: string
        - name: X-Upload-Session
          in: header
          required: false
          description: Upload session ID (to abort session instead of deleting file)
          schema:
            type: string
      responses:
        '200':
          description: Object deleted or session aborted
        '403':
          description: Access denied by storage policy
        '404':
          description: Object or session not found
        '429':
          $ref: '#/components/responses/BandwidthCapExceeded'
  /storage/{bucketName}/{path}/visibility:
    patch:
      tags:
        - Storage Objects
      summary: Update file visibility (public/private)
      description: |
        Change whether a file is publicly accessible. Only the file owner or a service key can change visibility.
        If the bucket defines UPDATE policies, the owner must also satisfy one of them.

        - Public files can be downloaded with just an anon key (no user authentication required)
        - Private files (default) require authentication and must pass policy checks
        - All downloads go through the Volcano API - there is no direct access to the underlying store
      operationId: updateStorageObjectVisibility
      security:
        - ServiceRoleKey: []
        - AuthUserAccessToken: []
      parameters:
        - $ref: '#/components/parameters/BucketName'
        - name: path
          in: path
          required: true
          description: Object path within bucket
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageVisibilityRequest'
      responses:
        '200':
          description: Visibility updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageObject'
        '403':
          description: Not the file owner or denied by the bucket's UPDATE policies
        '404':
          description: Object not found
  # ============================================================================
  # Public File Access (no authentication required)
  # ============================================================================
  /public/{projectId}/{bucketName}/{path}:
    get:
      tags:
        - Storage Objects
      summary: Download a public file (no authentication required)
      description: |
        Download a file that has been marked as public. This endpoint requires NO authentication.

        **Access Requirements:**
        - The file must have `is_public: true` set via the visibility endpoint
        - Private files will return 403 Forbidden

        **Use Cases:**
        - Shareable public URLs for profile pictures, public documents, etc.
        - Embedding public files on external websites
        - Direct linking without requiring SDK or authentication

        **URL Format:**
        ```
        GET /public/{projectId}/{bucketName}/{path}
        ```

        **Example:**
        ```
        https://api.volcano.dev/public/abc123/avatars/user-photo.jpg
        ```

        **CORS:**
        This endpoint allows all origins since the file is already public.
      operationId: downloadPublicFile
      parameters:
        - name: projectId
          in: path
          required: true
          description: Project ID
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/BucketName'
        - name: path
          in: path
          required: true
          description: Object path within bucket
          schema:
            type: string
      responses:
        '200':
          description: File content
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '206':
          description: Partial content (range request)
        '404':
          description: Not found (file doesn't exist or is not public)
        '429':
          $ref: '#/components/responses/BandwidthCapExceeded'
  # ============================================================================
  # Health Check
  # ============================================================================
  /health:
    get:
      tags:
        - System
      summary: Health check endpoint
      description: Returns server health status. Used for load balancer and monitoring checks.
      operationId: healthCheck
      responses:
        '200':
          description: Server is healthy
          content:
            text/plain:
              schema:
                type: string
                example: OK
