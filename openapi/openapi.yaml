  /projects/{id}/config:
    get:
      tags:
        - Projects
      summary: Export project configuration
      description: |
        Exports the project's current user-facing configuration as a
        declarative manifest. Returns JSON by default. Request the canonical
        volcano-config.yaml rendering with `Accept: application/yaml` or
        `?format=yaml`; the YAML is returned verbatim as the raw response body
        (`Content-Type: application/yaml`) and is meant to be saved as-is.
        Write-only secrets (SMTP password, OAuth client secrets, TLS material)
        are omitted from the export; the YAML rendering adds a header comment
        describing how to set them via CLI environment interpolation.
      operationId: getProjectConfig
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: format
          in: query
          required: false
          description: Response format override. Takes precedence over the Accept header.
          schema:
            type: string
            enum: [json, yaml]
      responses:
        '200':
          description: |
            Current project configuration. JSON by default; when YAML is
            requested the body is the canonical volcano-config.yaml document
            served verbatim with `Content-Type: application/yaml`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectConfig'
            application/yaml:
              schema:
                type: string
                format: binary
                description: |
                  Canonical volcano-config.yaml document returned verbatim,
                  ready to be saved as-is.
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Projects
      summary: Apply project configuration
      description: |
        Validates and applies a declarative configuration manifest to the
        project, reconciling each declared section and returning a per-resource
        report. Omitted sections are untouched. Declared collection keys
        (`variables`, `buckets[].policies`, `auth.providers.oauth`,
        `auth.email.templates`, `functions[].schedulers`) are fully synced:
        resources absent from the manifest are deleted. Functions, frontends,
        databases, and buckets are never created or deleted; manifest entries
        for resources that do not exist are skipped and reported in `skipped`,
        and existing resources missing from a declared section are reported in
        `missing`. Validation failures (including plan-gate violations) return
        422 and nothing is applied. Set `dry_run=true` to get the projected
        report without applying changes. Applies are serialized per project;
        a concurrent apply returns 409.
      operationId: applyProjectConfig
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: dry_run
          in: query
          required: false
          description: Validate and report projected actions without applying changes.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectConfig'
      responses:
        '200':
          description: |
            Apply report. Individual entries may still carry `action: error`
            for apply-phase failures (summary.errors > 0); already-applied
            changes are not rolled back.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectConfigApplyResult'
        '400':
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Another apply is in progress for this project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Manifest validation failed; nothing was applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectConfigValidationErrorResponse'
  /projects/{id}/git-connection/production-branch:
    put:
      tags:
        - Projects
        - Git Connections
      summary: Set the branch a project deploys from
      description: |
        Changes only the production branch, leaving the repository binding
        alone. PUT /projects/{id}/git-connection can also set it, but that is a
        full rebind: it needs connection_id, installation_id and a repository
        selector resent, and re-resolves the repository against GitHub for a
        field that does not depend on it.

        The branch does not have to exist. It is validated as a Git branch name
        and nothing more, so a project can be pointed at a branch that is about
        to be pushed — the case a repository created empty depends on.

        Setting the branch here marks it as the project's own choice, so a later
        default-branch rename on GitHub no longer moves it. Projects that never
        set one keep following the repository's default branch.
      operationId: setProjectGitProductionBranch
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetProjectGitProductionBranchRequest'
      responses:
        '200':
          description: The project's repo connection, with the new branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectGitConnection'
        '400':
          description: |
            Malformed request body, or a production_branch that is not a valid
            Git branch name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Project not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            Project not found, or it has no repository connected. The branch is
            part of the connection, so there is nothing to set it on until one
            exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to set the production branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/git-connection:
    get:
      tags:
        - Projects
        - Git Connections
      summary: Get a project's repo connection
      operationId: getProjectGitConnection
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: The project's current repo connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectGitConnection'
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Project not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found, or has no repo connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to get project git connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Projects
        - Git Connections
      summary: Connect or update a project's repo connection
      description: |
        Full replace, following Vercel's model: many projects may point at the
        same repo, so this only binds the project — it never creates or
        deletes git-provider state. Used for both the initial connect and
        later edits (repo change, root directory, production branch).
        Resolves the repository_id or repo_full_name selector against the repos
        accessible through installation_id via connection_id's stored GitHub
        user token, then persists repository metadata only from that validated
        GitHub response.
      operationId: connectProjectGit
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectProjectGitRequest'
      responses:
        '200':
          description: The project's repo connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectGitConnection'
        '400':
          description: |
            Malformed request body, no repository selector, selectors that
            identify different repositories, a production_branch that is not a
            valid Git branch name, no production_branch on a repository with no
            default branch to follow (name one to connect a repository that has
            no commits yet), or a production_branch other than the new
            repository's default in a request that also changes repository.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            Project not owned by the caller, or the selected repository is not
            accessible through installation_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project or connection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to connect project git
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Git provider integration is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Projects
        - Git Connections
      summary: Disconnect a project's repo connection
      operationId: disconnectProjectGit
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '204':
          description: Connection removed
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Project not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found, or has no repo connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to disconnect project git
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
