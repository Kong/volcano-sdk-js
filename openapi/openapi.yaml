      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/FrontendId'
        - name: days
          in: query
          description: Number of trailing days to return (1–90, default 30).
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrontendUsageHistoryResponse'
        '400':
          description: Bad request - invalid identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - project ownership required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Frontend not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/variables:
    get:
      tags:
        - Variables
      summary: List all variables for a project
      description: |
        Returns project-level environment variables used by deployed functions and frontends.
      operationId: listVariables
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/EndingBefore'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVariables'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Variables
      summary: Create or update a variable
      description: |
        Creates a project-level environment variable and triggers asynchronous propagation
        to deployed functions and frontends in the project's configured regions.
      operationId: createVariable
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVariableRequest'
      responses:
        '201':
          description: Variable created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variable'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/databases:
    get:
      tags:
        - Databases
      summary: List all databases for a project
      description: |
        Supports two mutually exclusive pagination modes. Offset mode uses `page`
        and `limit`. Cursor mode uses `cursor` and `limit`, supports `search`
        (case-insensitive name match), and returns `next_cursor`/`prev_cursor`.
        The optional `status` filter applies in both modes and is bound to the
        cursor. Sending both `page` and `cursor` (or `page` and `search`) returns 400.
      operationId: listDatabases
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/EndingBefore'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDatabases'
    post:
      tags:
        - Databases
      summary: Create a new serverless PostgreSQL database
      description: |
        Creates a serverless PostgreSQL database in the project.
        Each project can contain up to 100 databases. Requests over this cap return 403.
      operationId: createDatabase
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDatabaseRequest'
      responses:
        '201':
          description: Database created (provisioning)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Database'
        '403':
          description: Database limit exceeded for the project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/databases/{databaseName}:
    get:
      tags:
        - Databases
      summary: Get database details
      operationId: getDatabase
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Database'
    delete:
      tags:
        - Databases
      summary: Delete a database
      description: |
        Deletes a database and the instance backing it. When the instance is
        removed synchronously the database row is deleted and the response is
        `204`. If the instance cannot be deleted right away, the database row
        is retained (status `deleting`) and its teardown is handed to the
        background reconciler, which retries the deletion and removes the row
        once the instance is gone; in that case the response is `202`. The database row is
        never dropped while its instance still exists, so an instance is
        never orphaned without a record to retry from.
      operationId: deleteDatabase
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
      responses:
        '204':
          description: Database deleted (backing instance removed synchronously)
        '202':
          description: |
            Deletion accepted and in progress. The backing instance could not be
            removed synchronously, so the database is marked `deleting` and torn
            down asynchronously by the reconciler.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleting
                  message:
                    type: string
                    example: database deletion in progress
  /projects/{id}/databases/{databaseName}/branches:
    get:
      tags:
        - Database Branches
      summary: List a database's branches
      description: |
        Returns every branch of the database, including those still provisioning
        and those that failed, since each still holds a name.

        Connection strings are omitted. Fetch a single branch to get its
        connection string.
      operationId: listDatabaseBranches
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseBranchList'
        '404':
          description: Project or database not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Branching is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Database Branches
      summary: Create a branch of a database
      description: |
        Forks the database into a new branch. The branch starts as an exact copy
        of the parent's data and diverges from there.

        Provisioning is asynchronous: the response is `202` with the branch in
        `provisioning` and no connection string. Poll the branch until it reports
        `active`, at which point it carries its own connection string.

        Retrying a create with a name that already exists returns `409` rather
        than a second branch, so a retried request cannot silently consume two
        slots of the branch allowance.
      operationId: createDatabaseBranch
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDatabaseBranchRequest'
      responses:
        '202':
          description: Branch accepted and provisioning
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseBranch'
        '400':
          description: Invalid branch name or lifetime
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            The database has reached its branch allowance, or the owner's plan
            does not include branching.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project or database not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            A branch of that name already exists on this database, or the
            database cannot be branched right now because it is still
            provisioning, failed, or being deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Branching is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/databases/{databaseName}/branches/{branchName}:
    get:
      tags:
        - Database Branches
      summary: Get a branch
      description: |
        Returns the branch, including its connection string once it is `active`.
        Poll this after creating a branch to learn when it is connectable.
      operationId: getDatabaseBranch
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
        - $ref: '#/components/parameters/BranchName'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseBranch'
        '404':
          description: Project, database, or branch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Branching is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
        - Database Branches
      summary: Extend a branch's lifetime
      description: |
        Replaces the branch's lifetime and restarts the countdown from now, so a
        branch you are still working on is not swept mid-session. The new
        duration is remembered, so a later reset re-arms the same lifetime.
      operationId: updateDatabaseBranch
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
        - $ref: '#/components/parameters/BranchName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDatabaseBranchRequest'
      responses:
        '200':
          description: Lifetime updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseBranch'
        '400':
          description: Requested lifetime is outside the allowed range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project, database, or branch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The branch is being deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Branching is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Database Branches
      summary: Delete a branch
      description: |
        Marks the branch for teardown and returns immediately. The branch stops
        accepting connections at once; its fork and its row are removed by a
        background job, so a provider outage cannot leave the call hanging or the
        branch half-deleted.

        Deleting a branch that is still provisioning is allowed and stops the
        build, and repeating the call while teardown is in progress is accepted
        again. Once the branch is gone the call returns `404`.
      operationId: deleteDatabaseBranch
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
        - $ref: '#/components/parameters/BranchName'
      responses:
        '202':
          description: Deletion accepted and in progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleting
                  message:
                    type: string
                    example: branch deletion in progress
                required:
                  - status
                  - message
        '404':
          description: Project, database, or branch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Branching is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/databases/{databaseName}/branches/{branchName}/reset:
    post:
      tags:
        - Database Branches
      summary: Reset a branch to its parent's current state
      description: |
        Discards everything written on the branch and re-forks it from the
        parent as it is now.

        Returns immediately with the branch in `provisioning`. The rewind runs in
        the background; poll the branch until it reports `active` before
        connecting again.

        The branch keeps its name and its connection string, so anything holding
        that string keeps working once it is active again, and its lifetime is
        re-armed to the duration it was created with. The branch does not serve
        connections for the duration of the reset.
      operationId: resetDatabaseBranch
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
        - $ref: '#/components/parameters/BranchName'
      responses:
        '202':
          description: Branch reset accepted; the branch is provisioning
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseBranch'
        '404':
          description: Project, database, or branch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            The branch is not active, or a reset is already in progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Branching is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/databases/{databaseName}/branches/{branchName}/reset-password:
    post:
      tags:
        - Database Branches
      summary: Rotate a branch's password
      description: |
        Issues a new password for the branch and invalidates the previous
        connection string. Existing connections are not interrupted; new ones
        must use the returned string.

        The parent database's credentials are untouched.
      operationId: resetDatabaseBranchPassword
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
        - $ref: '#/components/parameters/BranchName'
      responses:
        '200':
          description: Password rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseBranch'
        '404':
          description: Project, database, or branch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The branch is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Branching is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/databases/{databaseName}/reset-password:
    post:
      tags:
        - Databases
      summary: Reset database password
      description: |
        Rotates the Volcano-managed PostgreSQL password used by clients when connecting
        through pgproxy. This does not rotate or expose the internal owner password.
        The returned password and connection string are the only client credentials that
        will authenticate through pgproxy after reset.
      operationId: resetDatabasePassword
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  role_name:
                    type: string
                    description: Volcano-managed per-database client login (also the pgproxy routing username)
                    example: volcano_client_11111111-1111-1111-1111-111111111111
                  new_password:
                    type: string
                    description: New Volcano-managed client password. Always starts with `vpg_`.
                  connection_string:
                    type: string
                    description: Updated pgproxy connection string using Volcano-managed credentials.

  /projects/{id}/databases/{databaseName}/type:
    patch:
      tags:
        - Databases
      summary: Update database size
      description: |
        Change the size tier of a database. This may briefly interrupt active connections.

        **Available sizes:**
        - `volcano-db-xs`: Up to ~1GB RAM - Development, small apps
        - `volcano-db-s`: Up to ~4GB RAM - Production-ready, light traffic
        - `volcano-db-m`: Up to ~8GB RAM - Medium traffic applications
        - `volcano-db-l`: Up to ~16GB RAM - High traffic, larger datasets
        - `volcano-db-xl`: Up to ~32GB RAM - Heavy workloads
        - `volcano-db-2xl`: Up to ~64GB RAM - Enterprise-scale
      operationId: updateDatabaseType
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDatabaseTypeRequest'
      responses:
        '200':
          description: Database type updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Database'
        '400':
          description: Invalid database type
        '404':
          description: Database not found
  /projects/{id}/databases/{databaseName}/stats:
    get:
      tags:
        - Databases
      summary: Get database consumption metrics
      description: |
        Retrieve consumption metrics including storage, compute time, and data transfer.
        Metrics are aggregated at the project level. Defaults to last 24 hours.

        **Note:** Advanced metrics require an upgraded plan.
      operationId: getDatabaseStats
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/DatabaseName'
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Start time in RFC3339 format (e.g., "2024-01-01T00:00:00Z"). Defaults to 24 hours ago.
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: End time in RFC3339 format (e.g., "2024-01-02T00:00:00Z"). Defaults to now.
        - name: granularity
          in: query
          required: false
          schema:
            type: string
            enum: [hourly, daily, monthly]
            default: hourly
          description: Level of detail for metrics aggregation
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseStats'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Database not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Database metrics not available or requires upgraded plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /databases/{databaseName}/query/ping:
    post:
      tags:
        - Database Queries
      summary: Database connectivity probe (REST API)
      description: |
        Connectivity probe that runs a fixed `SELECT 1` through pgproxy, using the
        same authentication, status/bandwidth gating, and metering as the other
        `/query/*` endpoints.

        Unlike those endpoints, ping takes **no request body** and performs **no
        table-name validation**, so it works on any database — including a freshly
        provisioned, empty one. It is a real committed round-trip through pgproxy,
        so a `200` means the database is reachable and queryable. Used by the
        dashboard's database connection test.
      operationId: queryDatabasePing
      security:
        - AuthUserAccessToken: []
      parameters:
        - $ref: '#/components/parameters/DatabaseName'
      responses:
        '200':
          description: Database is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseQueryResult'
              example:
                data:
                  - "?column?": 1
                count: 1
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Database not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/DatabaseQueryCapExceeded'
  /databases/{databaseName}/query/select:
    post:
      tags:
        - Database Queries
      summary: Query database with SELECT (REST API)
      description: |
        Query your database using a simple REST API - no SQL required!

        **Authentication:** Requires auth user access token (from signup/signin)

        **Row-Level Security:** Automatically enforced - you see only data you have access to

        **Use Cases:**
        - Query from browser/mobile apps
        - Simple data retrieval
        - Filtered searches with sorting and pagination

        **Note:** For complex queries (JOINs, CTEs), use functions with direct SQL
      operationId: queryDatabaseSelect
      security:
        - AuthUserAccessToken: []
      parameters:
        - $ref: '#/components/parameters/DatabaseName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseSelectRequest'
      responses:
        '200':
          description: Query successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseQueryResult'
              example:
                data:
                  - id: "uuid-123"
                    title: "My Post"
                    content: "Post content"
                    status: "published"
                    views: 150
                    created_at: "2026-01-13T10:00:00Z"
                count: 1
        '400':
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Database not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/DatabaseQueryCapExceeded'
  /databases/{databaseName}/query/insert:
    post:
      tags:
        - Database Queries
      summary: Insert data into database (REST API)
      description: |
