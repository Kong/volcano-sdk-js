                      enabled:
                        type: boolean
                      method:
                        type: string
                      name:
                        type: string
                  anonymous:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      method:
                        type: string
                      name:
                        type: string
                  oauth_providers:
                    type: array
                    items:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                        method:
                          type: string
                        provider:
                          type: string
                        name:
                          type: string
                        redirect_url:
                          type: string
                        scopes:
                          type: array
                          items:
                            type: string
                  available_methods:
                    type: array
