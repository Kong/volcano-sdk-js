            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "If the email exists, a password reset link has been sent"
        '403':
          description: Password reset is disabled for this project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (10 requests per hour per IP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password with recovery token
      description: |
        Reset password using recovery token from forgot-password.
        Revokes all existing sessions for security.
      operationId: authResetPassword
      security:
        - AnonKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - new_password
              properties:
                token:
                  type: string
                  description: Recovery token from forgot-password
                new_password:
                  type: string
                  description: |
                    Password validated after NFC normalization against the
                    policy returned by GET /auth/password-policy.
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Invalid or expired token
        '400':
          description: Password doesn't meet requirements
        '503':
          description: Compromised-password screening is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/confirm:
    post:
      tags:
        - Authentication
      summary: Confirm email address
