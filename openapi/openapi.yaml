    ProjectGitDeploySettings:
      type: object
      description: >-
        A project's GitHub auto-deploy settings: what a push to the connected
        repo's production branch deploys. All settings are default-off.
      properties:
        auto_deploy_enabled:
          type: boolean
          description: Whether a production-branch push triggers a deployment.
        deploy_functions:
          type: boolean
          description: Whether the repo's functions are deployed on push.
        frontend_name:
          type: string
          description: >-
            Name of the frontend to build and deploy on push. Omitted when no
            frontend is deployed. Resolved at deploy time; need not exist yet.
        frontend_app_root:
          type: string
          description: App root (subdirectory) the frontend builds from. Omitted for the repo root.
        updated_at:
          type: string
          format: date-time
      required:
        - auto_deploy_enabled
        - deploy_functions
        - updated_at
    UpdateProjectGitDeploySettingsRequest:
      type: object
      description: Full replace of a project's Git auto-deploy settings.
      properties:
        auto_deploy_enabled:
          type: boolean
        deploy_functions:
          type: boolean
        frontend_name:
          type: string
          description: Frontend to deploy on push. Omit or empty to deploy no frontend.
        frontend_app_root:
          type: string
          description: >-
            App root the frontend builds from. Requires frontend_name; omit for
            the repo root.
      required:
        - auto_deploy_enabled
        - deploy_functions
    ProjectLockLeaseRequest:
      type: object
      additionalProperties: false
      properties:
        ttl_seconds:
          type: integer
          minimum: 5
          maximum: 7776000
          description: |
            Lease duration in seconds, from 5 seconds through 90 days, measured
            from when the request is served. Renew before it elapses. A renewal
            sets the new expiry outright, so a shorter TTL shortens the lease.
            Renewals cannot extend an acquisition beyond its absolute 90-day
            deadline.
      required:
        - ttl_seconds
    ProjectLockLease:
      type: object
      additionalProperties: false
      properties:
        expires_at:
          type: string
          format: date-time
          description: Advisory lease expiry timestamp in UTC.
        fencing_token:
          type: integer
          format: int64
          description: |
            Monotonically increasing token for this acquisition. It rises whenever the
            lock changes hands and stays the same across renewals of one lease. Pass it
            to the resource you are protecting and reject any write carrying a token
            lower than the highest already seen; that is what stops a displaced holder
            from writing after its lease lapsed.
      required:
        - expires_at
        - fencing_token
    ProjectLockState:
      type: object
      additionalProperties: false
      properties:
        held:
          type: boolean
          description: |
            Whether the lock is unavailable right now. False means an acquire would
            succeed. It remains true during the brief grace window after expiry.
        expires_at:
          type: string
          format: date-time
          description: Advisory lease expiry timestamp in UTC. Present only when held.
        fencing_token:
          type: integer
          format: int64
          description: Current holder's fencing token. Present only when held.
      required:
        - held
    SetProjectGitProductionBranchRequest:
      type: object
      properties:
        production_branch:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            The branch a push must land on to deploy. Validated as a Git branch
            name only — it does not have to exist yet.
      required:
        - production_branch
    ConnectProjectGitRequest:
      type: object
      properties:
        connection_id:
          type: string
          format: uuid
          description: The caller's user_git_connections row (see /user/git/connections).
        installation_id:
          type: integer
          format: int64
        repository_id:
          type: integer
          format: int64
          description: >-
            Stable GitHub repository id (repository.id), the preferred selector.
            Either repository_id or repo_full_name is required; when both are
            given they must identify the same live repository.
        repo_full_name:
          type: string
          deprecated: true
          description: >-
            Deprecated selector kept for a compatibility window; prefer
            repository_id. Either repository_id or repo_full_name is required.
        root_directory:
          type: string
          description: Monorepo subdirectory the project builds from. Omit for the repo root.
        production_branch:
          type: string
          maxLength: 255
          description: >-
            The branch a push must land on to deploy, with three cases, because
            this is a full replace and a read-modify-write client sends back
            whatever it read. Omit it to follow the repository's GitHub default
            branch, which also discards a branch set earlier. Send back the
            branch the project already deploys from, when that is the
            repository's default, and nothing changes either way — a project
            pinned to that branch stays pinned. Sending the default branch when
            the project deploys from something else returns it to following the
            default, including on a rebind, where a pin describes a branch
            chosen for the repository being left. Any other branch becomes the
            project's own choice, exempt from later default-branch renames. Validated as a Git branch name only: it does not have to
            exist yet, so a project can be pointed at a branch about to be
            pushed. Changing repository and naming a branch other than the new
            repository's default in one request is refused with 400, because the
            branch named is almost always the previous repository's, echoed
            back — connect first, then set the branch.
      required:
        - connection_id
        - installation_id
