  # ============================================================================
  # Realtime WebSocket (SDK/Client)
  # ============================================================================
  #
  # WebSocket Endpoint: GET /realtime/v1/websocket
  #
  # This endpoint upgrades HTTP to WebSocket for realtime communication.
  # It is not documented as an OpenAPI path because it's a WebSocket upgrade.
  #
  # Authentication Options:
  #
  # Option 1: User Token (Frontend)
  #   - Query param: apikey={anon_key}
  #   - WebSocket handshake: token={user_access_token}
  #   - Use case: End-user applications
  #
  # Option 2: Service Role Key (Backend)
  #   - Query param: apikey={anon_key} (optional)
  #   - WebSocket handshake: token={service_role_key}
  #   - Use case: Server-to-server, bots, admin tools
  #   - Note: Project ID inferred from service key if anon key not provided
  #
  # Example connection URLs:
  #   ws://api.example.com/realtime/v1/websocket?apikey=ak-...
  #   wss://api.example.com/realtime/v1/websocket?apikey=ak-...
  #
  # The Centrifuge protocol is used for WebSocket communication.
  # See: https://centrifugal.dev/docs/transports/client_protocol
  #
  # ============================================================================

  # ============================================================================
