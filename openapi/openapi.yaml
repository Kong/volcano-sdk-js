        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to update project git deploy settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
