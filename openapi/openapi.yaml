                      $ref: '#/components/schemas/EmailTemplate'
  /email-templates/defaults/{type}:
    get:
      tags:
        - Auth Configuration
      summary: Get default email template by type
      operationId: getDefaultEmailTemplate
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [welcome, confirmation, password_reset, password_changed]
      responses:
        '200':
          description: Default template
          content:
            application/json:
