              schema:
                $ref: '#/components/schemas/Error'
  /auth/user/sessions:
    get:
      tags:
        - Authentication
      summary: Get current user's sessions
      description: |
        Returns paginated sessions for the currently authenticated user.
        Each session includes device info, IP addresses, and activity timestamps.
        The current session is marked with `is_current: true`.

        **Ordering and pagination.** Without `sort`, results are ordered by most
        recent activity and paged with `page`/`limit`, returning the
        `sessions`/`total`/`page`/`limit`/`total_pages` body below. This is the
        legacy default and is preserved for existing clients.

        Send `sort=created_at` to opt into the standard list contract: results are
        ordered by session start (newest first) and may be paged either with
        `page`/`limit` or by cursor with `cursor`/`ending_before` plus a bounded
        `offset` past the cursor anchor. Cursor responses use the shared
        `data` envelope with `next_cursor`/`prev_cursor`.

        Unlike other list endpoints, sending `limit` without `page` does **not**
        select cursor mode here; `sort=created_at` is the only opt-in. Cursor
        pagination is rejected with 400 for the activity order, because
        `last_activity_at` changes whenever a session refreshes its token: a row
        that crosses the cursor anchor between two requests would be skipped and
        never shown. The `status=expired` filter is also offset-only because a
        session can expire above the cursor anchor during a walk. Sending that
        filter in cursor mode, `page` with `cursor` or `ending_before`, or both
        cursor directions returns 400.
      operationId: authGetMySessions
      security:
        - AuthUserAccessToken: []
      parameters:
        - name: page
          in: query
          description: Page number (1-indexed)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of sessions per page (max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          description: |
            Sort key. `last_activity` (default) orders by most recent activity and
            supports offset pagination only. `created_at` orders by session start
            and supports both offset and cursor pagination.
          schema:
            type: string
            enum: [last_activity, created_at]
            default: last_activity
        - name: status
          in: query
          description: |
            Filter by whether the session can still be refreshed. Omit for every
            stored session, including expired ones. `expired` is not supported
            with cursor pagination.
          schema:
            type: string
            enum: [active, expired]
        - name: cursor
          in: query
          description: |
            Opaque keyset cursor from a previous response's `next_cursor`. Requires
            `sort=created_at`; mutually exclusive with `page` and `ending_before`.
          schema:
            type: string
        - name: ending_before
          in: query
          description: |
            Opaque keyset cursor from a previous response's `prev_cursor`, paging
            backward. Requires `sort=created_at`; mutually exclusive with `page`
            and `cursor`.
          schema:
            type: string
        - name: offset
          in: query
          description: |
            Bounded number of rows to skip past the cursor anchor (the hybrid
            jump, maximum 100000). Ignored unless `cursor` or `ending_before` is
            supplied.
          schema:
            type: integer
            minimum: 0
            maximum: 100000
      responses:
        '200':
          description: Paginated list of user sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthSession'
                  total:
                    type: integer
                    description: Total number of sessions
                  page:
                    type: integer
                    description: Current page number
                  limit:
                    type: integer
                    description: Number of sessions per page
                  total_pages:
                    type: integer
                    description: Total number of pages
                  data:
                    type: array
                    description: Sessions for this page (cursor pagination only)
                    items:
                      $ref: '#/components/schemas/AuthSession'
                  has_more:
                    type: boolean
                    description: Whether a further page exists (cursor pagination only)
                  next_cursor:
                    type: string
                    description: Opaque cursor for the next page (cursor pagination only)
                  prev_cursor:
                    type: string
                    description: Opaque cursor for the previous page (cursor pagination only). Send as `ending_before`.
        '400':
          description: Invalid or conflicting pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Authentication
      summary: Sign out from all other devices
      description: |
        Deletes all sessions except the current one.
        Use this to log out from all other devices while keeping the current session active.
      operationId: authDeleteAllMySessions
      security:
        - AuthUserAccessToken: []
      responses:
        '204':
          description: All other sessions deleted
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/user/sessions/{sessionId}:
    delete:
      tags:
        - Authentication
      summary: Sign out from specific device
      description: |
        Deletes a specific session, logging out that device.
        You can get session IDs from the list sessions endpoint.
      operationId: authDeleteMySession
      security:
        - AuthUserAccessToken: []
      parameters:
        - name: sessionId
          in: path
          required: true
          description: The session ID to delete
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Session deleted
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/user:
    get:
      tags:
        - Authentication
      summary: Get current user profile
      description: Returns authenticated user's profile. Requires access token.
      operationId: authGetUser
      security:
        - AuthUserAccessToken: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/AuthUser'
        '401':
          description: Not authenticated - access token missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Authentication
      summary: Update user profile
      description: Update password or metadata. Requires access token.
      operationId: authUpdateUser
      security:
        - AuthUserAccessToken: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: |
                    Password validated after NFC normalization against the
                    policy returned by GET /auth/password-policy.
                user_metadata:
                  type: object
                  additionalProperties: true
                  description: |
                    Metadata keys to merge into the current user metadata.
                    Omitted keys remain unchanged; set a key to null to remove it.
                    Merging is shallow; nested objects replace the stored value for that top-level key.
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/AuthUser'
        '400':
          description: Bad request - invalid password or metadata format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated - access token missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Compromised-password screening is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/user/identities:
    get:
      tags:
        - Authentication
      summary: List the current user's identities
      description: |
        Returns every real email identity the account owns. An account can own
        multiple identities (for example a password identity plus one or more
        OAuth identities on different emails). Anonymous accounts have no real
        identity and return an empty list.
      operationId: authListIdentities
      security:
        - AuthUserAccessToken: []
      responses:
        '200':
          description: List of identities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthIdentitiesResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/user/identities/{identityId}:
    delete:
      tags:
        - Authentication
      summary: Unlink an identity from the current user
      description: |
        Removes a non-primary identity and its attached sign-in methods. Refused
        when the identity is the account's primary, its only identity, or when
        removing it would leave the account with no way to sign in.
      operationId: authUnlinkIdentity
      security:
        - AuthUserAccessToken: []
      parameters:
        - name: identityId
          in: path
          required: true
          description: The identity ID to unlink
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Identity unlinked
        '400':
          description: Identity cannot be unlinked (primary, last, or would remove last sign-in method), or the identity id is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Identity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/user/methods:
    get:
      tags:
        - Authentication
      summary: List the current user's sign-in methods
      description: |
        Returns a flat list of every sign-in method the account owns (password,
        each OAuth provider, and any active anonymous method), with the primary
        method flagged. Password stubs and converted anonymous methods are excluded.
      operationId: authListMethods
      security:
        - AuthUserAccessToken: []
      responses:
        '200':
          description: List of sign-in methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMethodsResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/user/methods/{methodId}/promote:
    post:
      tags:
        - Authentication
      summary: Set a method as the account's primary
      description: |
        Promotes the given method to the account's primary sign-in method. The
        account's canonical email is re-derived from the promoted method's identity.
        Refused for password stubs and converted anonymous methods, and for an
        identity whose domain is outside the project's `allowed_email_domains`.
      operationId: authPromoteMethod
      security:
        - AuthUserAccessToken: []
      parameters:
        - name: methodId
          in: path
          required: true
          description: The method ID to promote
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The promoted method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMethodSummary'
        '400':
          description: This method cannot be set as primary (password stub, converted anonymous method, or unverified email), or the method id is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The promoted identity's email domain is not in the project's allowed_email_domains
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Method not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/auth/insights:
    get:
      tags:
        - Auth Admin
      summary: Get auth user insights
      description: |
        Returns current auth-user totals, rolling 30-day active users, and
        zero-filled signup and successful sign-in counts for an inclusive UTC
        date range. Weeks start on Monday. Sign-in counts and active-user
        activity begin when collection is deployed. Historical signup counts
        are backfilled from users present at deployment. Token refreshes affect
        active users but not the sign-in series.
      operationId: getAuthInsights
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: from
          in: query
          description: Inclusive UTC start date. Defaults to 29 days before `to`.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Inclusive UTC end date. Defaults to today.
          schema:
            type: string
            format: date
        - name: interval
          in: query
          description: Chart bucket size. Defaults to `day`.
          schema:
            $ref: '#/components/schemas/AuthInsightsInterval'
      responses:
        '200':
          description: Auth insights retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthInsightsResponse'
              example:
                project_id: 4f165080-a931-4e03-b3bd-41c45c3f0058
                observed_at: '2026-07-20T18:00:00Z'
                window:
                  from: '2026-06-21'
                  to: '2026-07-20'
                  interval: day
                summary:
                  total_users: 1234
                  active_users_30d: 418
                series:
                  - bucket_start: '2026-07-20'
                    signups: 12
                    signins: 97
                    is_partial: true
        '400':
          description: Invalid date range or interval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/auth/users:
    get:
      tags:
        - Auth Admin
      summary: List all auth users (admin)
      description: List auth users in project. Requires platform token.
      operationId: listAuthUsers
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/EndingBefore'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          required: false
          description: >-
            Filter by effective status. `banned` returns only currently-banned
            users; an expired temporary ban lists as `active`.
          schema:
            type: string
            enum: [active, banned]
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuthUsers'
        '400':
          description: Invalid status or pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/auth/users/{userId}:
    get:
      tags:
        - Auth Admin
      summary: Get specific auth user (admin)
      operationId: getAuthUser
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Auth user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
    delete:
      tags:
        - Auth Admin
      summary: Delete auth user (admin)
      description: Soft-deletes user and revokes all sessions
      operationId: deleteAuthUser
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User deleted
  /projects/{id}/auth/users/{userId}/sessions:
    get:
      tags:
        - Auth Admin
      summary: List user sessions
      description: |
        List paginated sessions for a specific auth user.
        Returns session details including device info, IP address, and activity timestamps.

        Ordering and pagination match `GET /auth/user/sessions`: the default is
        activity order with `page`/`limit` and the legacy `sessions` body, and
        `sort=created_at` opts into the standard cursor/offset hybrid with the
        shared `data` envelope. Cursor pagination is only available for
        `sort=created_at`, because the activity timestamp changes under paging.
        The `status=expired` filter is offset-only because sessions can expire
        above a cursor anchor during a walk.
      operationId: listUserSessions
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          description: Page number (1-indexed)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of sessions per page (max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          description: |
            Sort key. `last_activity` (default) orders by most recent activity and
            supports offset pagination only. `created_at` orders by session start
            and supports both offset and cursor pagination.
          schema:
            type: string
            enum: [last_activity, created_at]
            default: last_activity
        - name: status
          in: query
          description: |
            Filter by whether the session can still be refreshed. Omit for every
            stored session, including expired ones. `expired` is not supported
            with cursor pagination.
          schema:
            type: string
            enum: [active, expired]
        - name: cursor
          in: query
          description: |
            Opaque keyset cursor from a previous response's `next_cursor`. Requires
            `sort=created_at`; mutually exclusive with `page` and `ending_before`.
          schema:
            type: string
        - name: ending_before
          in: query
          description: |
            Opaque keyset cursor from a previous response's `prev_cursor`, paging
            backward. Requires `sort=created_at`; mutually exclusive with `page`
            and `cursor`.
          schema:
            type: string
        - name: offset
          in: query
          description: |
            Bounded number of rows to skip past the cursor anchor (the hybrid
            jump, maximum 100000). Ignored unless `cursor` or `ending_before` is
            supplied.
          schema:
            type: integer
            minimum: 0
            maximum: 100000
      responses:
        '200':
          description: Paginated list of user sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthSession'
                  total:
                    type: integer
                    description: Total number of sessions
                  page:
                    type: integer
                    description: Current page number
                  limit:
                    type: integer
                    description: Number of sessions per page
                  total_pages:
                    type: integer
                    description: Total number of pages
                  data:
                    type: array
                    description: Sessions for this page (cursor pagination only)
                    items:
                      $ref: '#/components/schemas/AuthSession'
                  has_more:
                    type: boolean
                    description: Whether a further page exists (cursor pagination only)
                  next_cursor:
                    type: string
                    description: Opaque cursor for the next page (cursor pagination only)
                  prev_cursor:
                    type: string
                    description: Opaque cursor for the previous page (cursor pagination only). Send as `ending_before`.
        '400':
          description: Invalid or conflicting pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
    delete:
      tags:
        - Auth Admin
      summary: Delete all user sessions
      description: |
        Revokes all sessions for a user, forcing them to re-authenticate on all devices.
        Use this to log out a user from everywhere.
      operationId: deleteAllUserSessions
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: All sessions deleted
        '404':
          description: User not found
  /projects/{id}/auth/users/{userId}/sessions/{sessionId}:
    delete:
      tags:
        - Auth Admin
      summary: Delete specific session
      description: |
        Revokes a specific session for a user.
        Use this to log out a user from a single device.
      operationId: deleteUserSession
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Session deleted
        '404':
          description: Session or user not found
  /projects/{id}/auth/users/{userId}/ban:
    post:
      tags:
        - Auth Admin
      summary: Ban a user
      description: |
        Bans a user temporarily or permanently. Banned users cannot sign in
        and all their active sessions are immediately revoked.

        - Omit `banned_until` for a permanent ban
        - Provide `banned_until` ISO timestamp for a temporary ban
      operationId: banAuthUser
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                banned_until:
                  type: string
                  format: date-time
                  description: When the ban expires (omit for permanent ban)
                  example: "2026-12-31T23:59:59Z"
      responses:
        '200':
          description: User banned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BanUserResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/auth/users/{userId}/unban:
    post:
      tags:
        - Auth Admin
      summary: Unban a user
      description: |
        Removes a ban from a user, restoring their ability to sign in.
        The user's status is set back to 'active'.
      operationId: unbanAuthUser
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User unbanned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnbanUserResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/email-templates:
    get:
      tags:
        - Auth Configuration
      summary: List email templates
      description: Returns all custom email templates for this project.
      operationId: listEmailTemplates
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Email templates list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EmailTemplate'
    post:
      tags:
        - Auth Configuration
      summary: Create email template
      description: |
        Creates a custom email template for the project. Custom email templates
        are a PRO-plan feature: requests from a FREE-plan project owner are
        rejected with 403, and FREE projects always send the built-in default
        templates regardless of any previously saved custom rows.
        Every project is created with one template per type, so customizing one
        is usually a PUT; creating a type the project already has returns 409.
        Valid template types: welcome, confirmation, password_reset, password_changed
      operationId: createEmailTemplate
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmailTemplateRequest'
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTemplate'
        '400':
          description: Invalid template type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Custom email templates require the PRO plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The project already has a template of this type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/email-templates/{type}:
    get:
      tags:
        - Auth Configuration
      summary: Get email template
      operationId: getEmailTemplate
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [welcome, confirmation, password_reset, password_changed]
      responses:
        '200':
          description: Email template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTemplate'
        '404':
          description: Template not found
    put:
      tags:
        - Auth Configuration
      summary: Update email template
      description: |
        Updates a custom email template. Custom email templates are a PRO-plan
        feature: requests from a FREE-plan project owner are rejected with 403
        (including after a PRO→FREE downgrade), so a FREE project cannot modify
        templates and always sends the built-in defaults.
      operationId: updateEmailTemplate
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [welcome, confirmation, password_reset, password_changed]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmailTemplateRequest'
      responses:
        '200':
          description: Template updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTemplate'
        '403':
          description: Custom email templates require the PRO plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Template not found
    delete:
      tags:
        - Auth Configuration
      summary: Delete email template
      description: |
        Deletes a custom template, reverting to the default. Custom email
        templates are a PRO-plan feature: requests from a FREE-plan project owner
        are rejected with 403.
      operationId: deleteEmailTemplate
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [welcome, confirmation, password_reset, password_changed]
      responses:
        '204':
          description: Template deleted
        '403':
          description: Custom email templates require the PRO plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Template not found
  /email-templates/defaults:
    get:
      tags:
        - Auth Configuration
      summary: Get default email templates
