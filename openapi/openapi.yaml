  /projects/{id}/auth/config:
    get:
      tags:
        - Auth Configuration
      summary: Get auth configuration
      operationId: getAuthConfig
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Auth configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'
    put:
      tags:
        - Auth Configuration
      summary: Update auth configuration
      description: |
        Updates the project's auth configuration. Only the fields present in
        the body are changed.
      operationId: updateAuthConfig
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAuthConfigRequest'
      responses:
        '200':
          description: Configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'
        '403':
          description: |
            The update would turn on, widen, or otherwise edit the email domain
            allowlist (`allowed_email_domains`, `allowed_email_domains_mode`)
            for a project that is not on the PRO plan. A FREE project keeps
            whatever allowlist it already has — parked, enforcing nothing until
            it upgrades — and may still remove it, so a downgrade never leaves a
            project locked out of its own signups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{id}/auth/config/test-email:
    post:
      tags:
        - Auth Configuration
      summary: Send a test email using the project's saved SMTP config
      description: |
        Sends a diagnostic email to `to_email` using the project's
        persisted `auth_config` SMTP credentials. If `html_body` or
        `text_body` is supplied, the override path is taken: those
        values (plus optional `subject`) are rendered through
        html/text templates against the project's `Data` and
        used as the body — used by the template editor's "Send Test"
        affordance to preview an unsaved template. With both bodies
        omitted, a hardcoded diagnostic message is sent and any
        `subject` field is ignored. Sending `subject` alone (no
        bodies) is rejected with 400 to avoid a silently-dropped
        subject or a blank message. Also rejects with 400 if
        `email_enabled=false` or `smtp_host` is empty.
      operationId: testEmailConfig
      security:
        - UserToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestEmailRequest'
      responses:
        '200':
          description: Test email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestEmailResponse'
        '400':
          description: Invalid request or email delivery not configured
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project not found
        '502':
          description: Template render failure or SMTP delivery failed
  /projects/{id}/auth/hosted-pages/{pageType}:
    get:
      tags:
        - Auth Configuration
      summary: Get hosted auth page
      description: |
        Returns the saved HTML/CSS for the page type, or `page: null` when the
        project has not customized it yet. Always returns `defaults` (the theme
        shell to seed an editor with, which is valid input to the update endpoint)
        and `runtime` (the script the rendered page runs, plus a preview harness).
      operationId: getAuthHostedPage
